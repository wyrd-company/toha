# ---
# relationships:
#   implements: architecture
# ---
version: "3"
tasks:
  build:
    cmds: [ cargo build ]
  test:
    cmds: [ cargo test ]
  test:network:
    desc: Run local HTTPS and opt-in Unix OpenSSH Git transport tests
    cmds:
      - cargo test --locked --test source_https fetches_https_git_repository
      - cmd: cargo test --locked --test source_ssh fetches_ssh_git_repository_with_key_authentication -- --ignored
        platforms: [ linux, darwin, freebsd, openbsd, netbsd, dragonfly, solaris, illumos, aix, android ]
      - cmd: echo "SSH Git transport fixture is Unix-only; Windows SSH coverage is skipped."
        platforms: [ windows ]
  lint:
    cmds: [ "cargo clippy --all-targets -- -D warnings" ]
  fmt:
    cmds: [ cargo fmt --all ]
  fmt-check:
    cmds: [ "cargo fmt --all -- --check" ]
  release:check:
    desc: Validate release configuration, workflows, and the crates.io package
    cmds:
      - actionlint .github/workflows/*.yml
      - >-
        ryl check -c .ryl.yml .github/workflows/*.yml Taskfile.yml
        .intentional/config.yml docs/docs.yml scripts/release/nfpm.yml
      - intentional check
      - cargo test --locked --test release_contract
      - cargo publish --dry-run --locked --allow-dirty --target-dir target/publish-check
  ci:
    deps: [ fmt-check, lint, test, release:check ]
  demo:
    desc: Build the CLI and render the terminal demo
    cmds:
      - cargo build
      - vhs docs/demo.tape
