[package]
name = "toha"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"

[features]
default = ["cli"]
cli = ["dep:clap"]

[dependencies]
minijinja = { version = "2.24", default-features = false, features = ["builtins", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
indexmap = { version = "2", features = ["serde"] }
thiserror = "2"
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
pretty_assertions = "1"

[[bin]]
name = "toha"
path = "src/main.rs"
required-features = ["cli"]
