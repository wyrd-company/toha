name: sample
interview:
  - id: code
    type: text
    prompt: Code?
    validate: { min: 2, max: 2, regex: '^[A-Z]+$' }
    format: value | lower
  - id: items
    type: text
    prompt: Items?
    loop: { min: 1, max: 2 }
    validate: { min: 1, max: 3, regex: '^[A-Z]+$' }
    format: value | lower
