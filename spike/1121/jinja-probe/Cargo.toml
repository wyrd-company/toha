[package]
name = "jinja-probe"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
minijinja = { version = "2.24", default-features = false, features = ["builtins", "serde", "json", "macros", "loop_controls", "multi_template", "unstable_machinery"] }
minijinja-contrib = { version = "2.24", features = ["pycompat"], optional = true }
serde_json = "1"

[features]
pycompat = ["dep:minijinja-contrib"]
