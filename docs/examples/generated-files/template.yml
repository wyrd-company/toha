name: generated-files
description: A task runner config with one file for each task

interview:
  - id: project
    type: text
    prompt: Project name
    required: true

  - id: tasks
    type: text
    prompt: "Task name (empty to finish)"
    loop:
      min: 1
    validate:
      regex: '^[a-z][a-z0-9-]*$'

  - id: init_git
    type: confirm
    prompt: Make a git repository?
    default: true

  - hook:                                        # joins the hook list here, in interview order
      run: [ git, init ]
    when: init_git

  - message: "Generating {{ tasks | length }} task file(s) for {{ project }}"
    at: before-apply

files:
  - each: tasks as task                          # one file for each item
    source: tasks/_task.yml                      # not rendered by itself
    path: "tasks/{{ task }}.yml"

ignore:
  - "**/*.orig"
  - "tasks/_task.yml"                            # the source above is only used by `each`

static:
  - "assets/**"                                  # copied, not rendered

hooks:                                           # run after the interview hooks
  - run: [ git, add, "." ]
    when: init_git

messages:
  - at: after-apply
    text: "Run `tasks/{{ tasks | first }}.yml` to start"
