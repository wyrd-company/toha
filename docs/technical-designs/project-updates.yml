$schema: https://refinery.systems/ontology/technical-design
relationships:
  realizes: toha
  implements:
    - command-line-interface
    - interview-protocol
    - applied-record
  related-to:
    - architecture
    - template-composition
    - content-injection
    - in-project-generators
    - confirm-flow
objective: >-
  Record each template application in the project and merge template changes
  into it while preserving operator edits and Git conflict resolution.
proposed-design:
  high-level-overview: >-
    applied::Project opens the containing repository and supplies validated
    readers, ownership capture and merge operations. An update adapter drives
    the shared interview from the recorded raw answers. One candidate-tree
    builder composes rendering, ownership transitions and capture, and the same
    renderer produces the merge base from the applied record. Gitoxide merges
    whole-repository trees in process and a guarded working-tree/index
    transaction writes results.
  repository-boundary: >-
    Discovery starts at the target's closest existing ancestor and validates the
    target relative to the canonical working tree. OS components convert to
    slash-separated RepoPath values at that boundary. The in-memory Git
    configuration removes configured clean, smudge, process and merge drivers
    before status, checkout, conversion or merge. Built-in line-ending and
    working-tree-encoding conversion remains active. No Git driver subprocess
    runs and repository configuration is unchanged by these operations.
  applied-record: >-
    The applied record `.toha.json` holds one entry per application: template
    identity, selected parts, raw accepted answers, the frozen render instant,
    every referenced render input not derivable from the entry, and per-path
    ownership. Referenced context includes target name, template aliases and
    selection source, host and environment values, across all compiled surfaces
    and included partials. Identity-derived context follows from the entry.
    Whole-file and hook-owned paths require both the Git object id and the Git
    entry mode; edit-owned paths hold regions and values without blob or mode.
    The template composition design defines its path, its members, its schema
    and when a run writes it. The record supplies the application's durable
    inputs; the update also reads the recorded template revision, HEAD and
    retained objects. Toha creates no Git ref.
  capture: >-
    Every apply, update and baseline that writes files into a Git work tree
    captures ownership into its record entry. Capture includes every plan
    mutation, including unchanged owned targets, and hook changes under the
    target. Whole-file and hook entries require the recorded Git mode 100644,
    100755 or 120000 and retain symlink contents without following links.
    Untracked ignored files, gitlinks, submodule contents and outside-target
    files are excluded; tracked files remain eligible despite ignore rules.
    Outside-target hook changes are reported. Each whole-file and hook-owned
    path also records the Git object id of the bytes left after every hook.
    Content uses Git built-in stored-form conversions only. A preview records
    nothing.
  ownership-transitions: >-
    Whole ownership replaces the entire captured file; removed whole targets
    disappear from the template side. Hook-owned paths carry forward from the
    recorded entry unless the new plan owns or changes them. Edit ownership
    retains region keys and JSON paths. The builder retracts uncovered regions
    and JSON values before applying new intent, removing array elements from
    highest index down. A new whole mutation covers all old ownership; a region
    covers the same key; a JSON value covers values at or below its path.
    Retracting the last owned identity still records the path as edit with empty
    ownership lists, so that change participates in the merge. A path whose
    recorded entry already holds edit with empty ownership lists is released and
    omitted from both base and candidate template trees, preserving the operator
    file. Update never removes an edit-owned file.
  answer-replay: >-
    The crate-private adapter queues recorded raw values per id, including loop
    values. Verified route overrides replace queued values. Each pending batch
    consumes its next usable values; rejected values become unanswered with
    retained rejections. Raw replay nulls remain empty answers and do not take
    configured or template defaults; required questions reject them. Recorded parts are queued only when the applied revision
    had a part question, including an empty selection. A first-added part
    question is asked. Document answers are not queued. Person routes prompt,
    scripts report questions and agents save a stage carrying a copy of the
    recorded entry and the accepted submissions. Reanswer sends every batch to
    the route with recorded defaults. Resume reconstructs queues from the copied
    entry, replays accepted staged submissions and removes consumed values
    exactly once. Update preserves the recorded frozen instant and records
    values actually submitted.
  candidate-and-preview: >-
    Real updates check out HEAD into a temporary directory, apply ownership
    retractions and the new plan through a destination adapter, run trusted
    hooks there and capture the candidate. Planning retains the real project
    target for invocation facts. Preview uses the same builder on in-memory HEAD
    images with hooks suppressed and hook-owned bytes carried forward; those
    outputs are marked not previewed. CLI dry-run and interview DryRun both
    select this path. Preview changes no project file, index, record or staged
    record. Equal revision, answers, parts, referenced context and output produce
    already-current without a retained candidate.
  merge: >-
    Base is HEAD with the target replaced by the merge base rendered from the
    recorded revision, answers (documents included), parts, generated instant
    and context, without hooks. A failed render, unanswered question,
    unavailable revision or unversioned source refuses the update and names
    --baseline. A whole-file path uses rendered bytes only when their Git object
    id matches its recorded
    blob; otherwise it uses the retained object with that id. A hook path uses
    only its retained object. Base entries use the required recorded mode,
    never HEAD's mode; a missing mode leaves an ambiguous entry without a base.
    Released paths and paths without matching bytes are absent from the base.
    Without base bytes, an equal candidate and project file is unchanged;
    differing candidate bytes conflict add/add, and a candidate removal conflicts
    modify/delete, preserving operator files. Edit-owned paths use HEAD bytes
    as their base. The candidate uses the current run's context; ours is HEAD;
    theirs substitutes candidate files. Re-baseline uses an empty base target.
    Rename detection is off. Operator-only paths remain ours. Git line merging combines
    disjoint changes and reports overlaps. Driver-attributed paths keep operator
    content and conflict stages. Clean results are staged. Text conflicts
    receive diff3 markers and stages 1/2/3; binary, add/add, modify/delete,
    file/directory, driver and link conflicts (including links reported as
    `content`) keep operator files with corresponding
    stages. Paths and index entries outside the target remain intact, except the
    record entry the transaction writes. Toha creates neither a commit nor Git
    merge state.
  transaction-and-cleanup: >-
    Preconditions require a clean target, a record equal to HEAD, and a recorded
    application for the template's source and the target. Candidate construction
    follows the trust gate. Merge checks occupied untracked paths before
    locking. Under the index lock, HEAD, index checksum, target cleanliness and
    occupied paths are checked again. Each replacement verifies current HEAD
    bytes or absence immediately before writing, and the record is written last.
    Failure rolls back only paths still holding this invocation's output and
    preserves concurrent edits, then releases its lock and removes its temporary
    candidate. Cleanup failure retains the original error and names the
    remaining paths. After transaction commit, reporting failure retains the
    result and the record. Recovery guidance is target-scoped.
  completion-output: >-
    The candidate apply retains interview and apply messages and hook outcomes
    through merge_apply_reported. The CLI formats person and completed
    staged-agent updates as prose naming template, target, prior and resolved
    revision, parts added and removed, merge actions, conflicts and record
    outcome. Scripted updates retain JSON results. Remaining-question batches
    retain their protocol. Preview, already-current, trust and conflict guidance
    follow the command-line-interface contract.
  base-selection: >-
    An update's base is the record entry for its template's source and its
    target. No route chooses among candidate bases, and no listing marks one.
    Reader APIs expose domain values rather than Gitoxide types.

  library-operations: >-
    The updates module prepares the base, selected revision, configured defaults,
    context and recorded answer queue from explicit caller inputs. Preparation
    admits the project, source, merge base, requirements and configured defaults
    before the caller acquires clock and environment facts; finish captures those
    facts. UpdateSession.start admits and submits overrides alongside recorded
    answers and retains any resulting rejection, abort or stop. Its owned record
    keeps initial override values separate from accepted batches so replay cannot
    fall back to an older answer after a rejection. UpdateSession
    holds one loaded request and an owned StagedRecord. The record crosses request
    boundaries; the loaded Git-bound operation is constructed and consumed inside
    one blocking worker. Its question form omits valid covered answers, using the
    same replay queue and validator to submit them with the new answers. Command
    drivers retain their whole-batch defaults and presentation. Both routes use
    the same base reconstruction, interview and merge implementation, and every
    apply receives the caller-selected HookRunner.
