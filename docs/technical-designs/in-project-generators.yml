$schema: https://refinery.systems/ontology/technical-design
relationships:
  realizes: toha
  implements:
    - command-line-interface
    - interview-protocol
    - applied-record
  related-to:
    - architecture
    - project-updates
    - template-defaults
    - template-composition
objective: >-
  Seed a new template application from one recorded application while preserving
  selected source identity, ordinary apply behavior and default provenance.
proposed-design:
  high-level-overview: >-
    The generate axis is an apply pattern: the same template writes to distinct
    project subpaths. cli::like selects an application through the repository-wide
    applied-record reader and converts its accepted raw answers into ApplicationSeed.
    Resolution layers that seed over configured entries before starting the shared
    engine. The selected entry also supplies parts for the part-selection rules.
  selection: >-
    Candidates are validated applications whose source identity matches the
    template source, across all target subpaths in the repository. --like TARGET
    selects the entry at that repository-relative target. A missing application,
    invalid record or wrong-source selection fails. Bare like is a person-route
    picker; scripts and agents must name a target. The record orders no entry by
    time, and no temporal or snapshot-id selector exists. Without like, apply asks
    its ordinary questions. Like excludes update and baseline and requires a
    containing Git project.
  seed-boundary: >-
    The selected entry's answers supply one raw value per question id, preserving
    loop arrays and whole document values. Application and repository types stop
    at this boundary. ApplicationSeed carries the raw defaults and application
    target as provenance. Resolution::start_with_seed builds a single-occupant
    default bank: a kind-matching application value wins over the configured value
    for that id; wrong-kind values are dropped with warnings, revealing the
    configured or template fallback. Entries for questions the template does not
    define do not become defaults. Parts remain separate from answers and follow
    the template composition design's part-selection rules.
  precedence-and-validation: >-
    Route submissions win over application defaults, then configured defaults,
    then template defaults. Application bank entries retain their source target
    in prepared-default rejections. The engine validates and formats values under
    the selected template. A constraint rejection prompts a person or reports a
    remaining question to a script or agent. Without a seed, the interview follows
    the normal context-bearing Resolution start path; configured entries retain
    their mapping and preset origins in either path.
  staged-seed: >-
    The optional staged seed member stores the selected application target, and
    seed_entry copies the selected entry, including its answers and parts. Resume
    uses the copy even if the live entry changes or is removed. The seed remains
    separate from the update base. Accepted explicit submissions replay over
    seeded defaults. Result documents expose seed.from as the selected target
    without answer values.
  apply-and-capture: >-
    Selection writes no repository state. The ordinary plan and apply path writes
    the new target, enforces existing conflicts and trust, and captures ownership
    under the applied-record rules. Identity is the selected source and target
    pair. An apply that writes files inside Git replaces that pair's entry in the
    repository's applied record; preview writes none. The interview engine knows
    neither Gitoxide nor application repository selection.
