$schema: https://refinery.systems/ontology/technical-design
relationships:
  realizes: toha
  implements:
    - command-line-interface
    - interview-protocol
    - template-format
  references:
    - architecture
    - content-injection
    - headless-recovery
    - hook-results
    - template-registry
objective: >-
  Let a project generated from a template take that template's later changes
  without losing the operator's edits: save the exact output of every apply in a
  git repository as a snapshot under a Toha-owned ref, and let `apply --from`
  render the template again and merge old snapshot to new snapshot into the
  operator's working tree as git would, in process and without a subprocess.
background:
  current-design: >-
    Apply writes rendered files into the target and records nothing there. An
    existing target file is a conflict that only --force overwrites. The
    resolved commit and the accepted raw submissions exist only in the staged
    interview in the user's state directory, deleted after a successful apply.
    Toha opens git only to fetch templates; the target is never treated as a
    git repository. Content injection adds Whole, Region, and JsonValue
    ownership identities and defers update behaviour to this design.
  problems:
    - >-
      A template change cannot reach an already generated project without
      overwriting every operator edit.
    - >-
      Nothing records what an apply produced, so a merge has no base.
design-challenges:
  exact-base: >-
    A three-way merge needs what Toha actually wrote, including hook output and
    injected content, not what the plan intended or a re-render that may not
    reproduce.
  branches-and-history: >-
    The base must be correct on every branch and must survive the operator
    squashing or rebasing their history.
  sharing: >-
    A teammate's clone must be able to update, while Toha never touches
    remotes and never commits to the operator's branches.
  operator-safety: >-
    No operator edit is lost without consent; every conflict is visible to git
    so it cannot be committed by accident, and the pre-update state is
    recoverable with git alone.
proposed-design:
  high-level-overview: >-
    Save exact generated output as parentless git snapshots and use a selected
    snapshot as the base for an in-process three-way merge of newly generated
    output with the operator's project. Render and run trusted hooks in a
    throwaway checkout, then apply the merge through a checked working-tree and
    index transaction. Keep successful snapshots; remove this invocation's
    candidate ref on every unsuccessful post-capture exit before transaction
    commit, preserving operator state and reporting cleanup failures.
  snapshot: >-
    A parentless git commit under refs/toha/snapshots/<ULID>, whose tree holds
    snapshot.json (template, commit, target, instants, project commit and
    branch, built-from, raw submissions, path origins) and files/ (the apply's
    output relative to the target). Saved by every apply in a git repository
    whose target directory was clean before the apply.
  update: >-
    apply TEMPLATE PATH --from SNAPSHOT replays the recorded raw answers through
    an update replay adapter, asks only what the new version needs, renders and
    runs hooks in a throwaway checkout of HEAD, retracts dropped injections,
    saves the new snapshot, and merges the base snapshot's files/ to the new
    snapshot's files/ onto the target's tree at HEAD in process (operator is
    ours, template is theirs). It re-checks HEAD, the index, and the target
    under the index lock, writes merged files and git index conflict stages,
    and rolls back on a write failure. Toha never commits.
  adoption: >-
    apply TEMPLATE PATH --baseline merges the render against an empty base.
  commands: >-
    snapshots list (likely base by ancestry, then by content; JSON output),
    snapshots clean (multi-select, --keep N, --remove FILE acting immediately,
    whole-template removal refused without --force), init (fetch setting only).
  routes: >-
    Person, script, and agent routes support --from, --baseline, and --reanswer;
    the staged interview records the base; the clean check runs at stage and at
    the final apply.
  module: >-
    A new public toha::snapshot module (project, record, capture, merge) is the
    only code that names gitoxide repository, status, merge, and index APIs. It
    consumes Plan::build, Plan::apply, and the staged-replay walk unchanged.
approved-decisions:
  git-required-for-update: Updating needs a git repository; plain apply does not.
  no-update-command: Updating is apply with --from; the person route prompts for the snapshot.
  base-is-a-snapshot: The merge base is the stored output of an earlier apply, not a re-render and not the plan.
  snapshot-selection: The user selects the base snapshot; Toha lists snapshots with template version and project commit and marks the likely base.
  no-version-ordering: Toha shows from and to versions and never labels an upgrade or downgrade.
  clean-target-for-from: apply --from requires a clean target directory.
  toha-never-commits: The merge result and conflicts are left uncommitted for the operator.
  hooks-in-throwaway-checkout: During --from and --baseline, render and hooks run only in a throwaway checkout of HEAD; non-file hook effects are not Toha's concern.
  automatic-snapshots: Every apply in a git repository with a clean target saves a snapshot; otherwise apply behaves as today and says why.
  snapshot-commands: snapshots list and snapshots clean (multi-select, --keep N, JSON removal, whole-template removal refused without --force).
  sharing: Toha never touches remotes; toha init adds the fetch setting; the user pushes with git using printed per-ref commands, never --prune.
  onboarding-deferred: Onboarding in toha init is backlog task 1108.
  adoption: apply --baseline merges against an empty base at whatever version is applied; --baseline with --from is an error.
  answers: Raw answers are replayed; only new or rejected questions are asked; --answers FILE overrides; --reanswer walks every question with recorded defaults.
  version-checks: A snapshot of another template source is refused (the source is the formal name without its @reference, so @A to @B is the same template); same version, answers, and output is already current; same version with different answers is allowed.
  conflicts: Diff3 markers plus git index conflict stages, as git merge leaves them (operator is ours, template is theirs, clean changes staged); the output lists conflicted files.
  parentless-snapshots: Snapshots have no git parent; lineage is in snapshot.json; clean deletes refs.
  snapshot-identity: A ULID, stable and unique across clones; prefixes accepted.
  routes: All three caller routes support --from and --baseline.
  monorepo-scope: The clean check, snapshot, and merge cover the target directory only; the throwaway checkout is the whole HEAD; a snapshot for another target path is refused.
decisions-for-approval:
  owned-content-merge: >-
    Recommend that an update merges owned regions and JSON values by line like
    the rest of the file: a change only the template made applies, separate-line
    changes from both sides both apply, and overlapping changes conflict.
    Alternative: keep apply's convergence for JSON values during update, so
    Toha's value wins silently, which needs value-aware post-processing of the
    merge and discards the operator's change without consent.
  generated-instant: >-
    Recommend that every render of a project uses the frozen now() of its first
    snapshot, carried forward, so a date the template renders does not change on
    every update. Alternative: the current instant, which turns every rendered
    date into a template change at each update.
  drivers: >-
    Recommend that Toha never runs a git merge driver or filter driver: it
    removes every filter.<name>.clean, smudge, and process value and every
    merge.<name>.driver value from the in-memory configuration of the target's
    repository before any status, checkout, or merge; a snapshot path whose
    attributes name a driver is not merged, keeps the operator's content, and is
    reported as a conflict of kind driver; filtered files are compared and
    written in their stored form. This excludes git-lfs-managed and
    custom-merge-driver paths from automatic merging, a limit of the new
    feature only. Alternative: honour configured drivers as git does, which
    starts external programs (for example git-lfs) and needs separate approval
    as an application subprocess.
  hook-path-carry-forward: >-
    Recommend carrying a hook-origin path forward with the base snapshot's
    content when the new apply neither wrote nor changed it, so a hook that
    rewrites a file unchanged does not delete it from the project. Alternative:
    drop it, which deletes unedited hook output such as a regenerated
    lockfile. Cost: a file a hook stops producing is never removed by an update.
disclosures:
  new-effect-on-apply: >-
    Every apply in a git repository with a clean target now writes git objects
    and one ref under refs/toha/snapshots/ into the operator's repository. It
    never touches branches, the index, HEAD, or remotes during a plain apply.
  new-effect-on-update: >-
    apply --from and --baseline write the operator's index (merged entries and
    conflict stages) in addition to working-tree files.
  git-config: >-
    toha init, when the operator runs it, adds one fetch setting to the
    repository's local git config.
  dependency: >-
    Two added features of the existing gix 0.87.1 dependency, merge and status
    (which enable blob-diff and dirwalk), adding the crates gix-merge,
    gix-imara-diff, gix-status, and gix-dir from the gitoxide project. Toha
    calls the built-in text merge only and never runs merge or filter drivers.
  none-of: >-
    No new permission, timeout, pinned-version check, or application
    subprocess. No capability is removed or narrowed.
out-of-scope:
  - Rename detection and moving a target directory.
  - Version ordering.
  - Pushing, fetching, pruning, committing to operator branches, git init.
  - Onboarding in toha init.
  - Non-file hook side effects.
  - Changes to injection's apply-time ownership semantics, the answers-document
    contract, the hook-result lifetime, or trust.
  - Canonical specification, schema, guide, and example edits, which the paired
    implementation owns.
validation:
  - The acceptance scenario across two clones, including git's own view of the conflict and an already-current rerun.
  - Merge outcomes per path (one-sided, both-sided, removal, addition, binary, untouched operator files).
  - Snapshot capture rules (plan-written, hook-changed, ignored, carried forward, outside-target warning).
  - Injection content (region, JSON value) through the merge.
  - Answer replay, --reanswer, and already-current detection.
  - Routes, staged base, clean checks at stage and apply, trust, and hook failure isolation.
  - snapshots list, clean, init, and the no-process guard.
  - The snapshot boundary rejects forged metadata, parents, gitlinks, and extra tree entries.
  - Injection retraction, unchanged-injection capture, ignore and symlink capture rules, and CRLF.
  - Concurrency re-check, occupied paths, and write-failure rollback.
  - Replay adapter cases (rejected values, added required questions, loops, overrides) and source identity across references.
  - >-
    Every unsuccessful post-capture exit removes its candidate ref; omitted
    cleanup fails a complete before/after snapshot-ref witness, with separate
    cleanup-failure and concurrent-replacement cases.
