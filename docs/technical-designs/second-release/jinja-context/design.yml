$schema: https://refinery.systems/ontology/technical-design
relationships:
  realizes: toha
  implements:
    - template-format
    - interview-protocol
    - command-line-interface
  references:
    - template-registry
    - architecture
    - error-attribution
    - jinja-includes
objective: >-
  Give terminal, headless, staged/resumed, and direct crate callers one pure,
  replay-stable Jinja context for canonical target, selected template, host,
  execution, and five fixed environment values while preserving the ownership
  of presets, trust review, includes, and canonical target identity.
background:
  current-design: >-
    Interview and planning build separate maps from data, answers, and time.
    Source-tree Jinja compiles only during planning. Staging stores submissions
    but no invocation context.
  problems:
    - >-
      Environment admission must occur before interview progress, but existing
      undeclared-variable analysis misses context enumeration through debug(),
      self-shadowing reads, and include closures.
    - >-
      Later batches cannot ask for trust or reread ambient values. Mutable
      folder templates must not gain a new source-change refusal.
    - >-
      Canonical target and selected formal identity already have producers; a
      consumer normalizer or resolver would create conflicting policy.
design-challenges:
  complete-analysis: >-
    Every configuration expression/template, source-tree path and body, and
    literal file-body include must contribute needs before Seed.
  caller-parity: >-
    One immutable value must serve every driver and every render surface through
    the pure engine.
  minimal-replay: >-
    Staged state must be deterministic without fresh access, an open-ended map,
    or a new mutable-source restriction.
  compatibility: >-
    Records created before the context contract cannot supply historical host,
    interaction, identity, or access facts.
proposed-design:
  high-level-overview: >-
    Template::load retains one complete in-process render program and computes
    a conservative environment need. Template::admit_environment combines that
    need with Deny, GrantIfNeeded, RequireStageGrant, or CarryStageGrant.
    InvocationContext flows through Seed, Pending, Completed, staging, and Plan
    through one private projection.
  analysis: >-
    An isolated MiniJinja AST adapter walks reads in evaluation order, lexical
    aliases and shadowing, dynamic operands, macros, all branches, debug()
    aliases, and literal include closures. Uncertain supported forms mark all
    five observable instead of failing syntax. No new crate is added.
  public-contract: >-
    Expose seventeen current-context variables with exact string, nullable,
    array, and boolean types. Reserve only those exact names. Presets remain
    configured answer defaults and are not Jinja context. Ordinary Seed defaults
    remain the separate flat application-default route.
  configured-origin: >-
    ConfigEntry remains the sole origin source. configured_defaults copies each
    winning mapping and optional preset origin into the private ResolvedDefault
    entry in Resolution. Configured start consumes Resolution through
    start_with_context; configured replay consumes it through
    replay_with_resolution with the restored InvocationContext. Both move entries
    into DefaultBankEntry::Configured. Only into_flat_defaults deliberately loses
    provenance. Ordinary direct callers keep flat Seed.defaults with context; no
    second resolver or origin map is added.
  access: >-
    Direct/new apply uses explicit --trust or a current matching reviewed
    approval for an eligible named user/system entry. Stage requires its own
    explicit --trust whenever analysis finds any environment need. An explicit
    stage flag carries its grant even when the initial program has no reference.
    Continue has no trust option; staged apply trust remains hook-only.
  snapshot: >-
    Stage without a need or flag reads nothing and records Unavailable. Explicit
    stage --trust captures all five optional values once even without a need. A
    direct/new-apply grant captures only when needed; denial reads nothing. The
    fixed five-field structure is not an environment map.
  staging: >-
    The versioned context wire stores supplemental selected identity, host,
    execution, and environment snapshot. Target and formal name remain in their
    existing record fields. Store::load receives CanonicalTarget, validates
    stored path text, and reconstructs the live context without deserializing a
    carrier. Replay performs no access or ambient read.
  mutable-folders: >-
    Resume continues to load current folder bytes. A no-flag Unavailable
    snapshot yields null for later-added references. A carried stage grant or
    other Captured snapshot supplies its recorded five values to later-added
    references. No source identity gate or later access gate is added.
  legacy: >-
    A record with no context field uses the pre-context projection and
    available/reserved-name set. It invents no facts, exposes no new values, and
    needs no access-related abort/restage path.
  module-seam: >-
    template owns render compilation, include closure, analysis, and collision
    locations; context owns typed facts, projection, redaction, and wire
    conversion; command adapters own trust and capture; interview carries the
    context; staging owns replay; plan consumes the producer carrier and
    completed context.
  compatibility: >-
    Seed gains a required context for direct callers. Source-tree syntax errors
    can surface at template load. ConfigEntry origins continue through the
    private configured Resolution and DefaultBank; the ordinary flat Seed route
    remains exact and distinct. Existing mutable folder behavior, input modality,
    now(), protocol metadata, configured defaults, hook review, and producer
    target interfaces remain.
  canonical-impact: >-
    Paired implementation updates template format/schema, the Jinja guide,
    command-line contract, interview protocol, and a registry reference. This
    design changes no runtime or shared canonical file.
  verification: >-
    Fixtures cover every render surface; debug, alias, self-shadowing, dynamic,
    include, and uncertain analysis; failure order; capture matrix; mutable
    folders; legacy replay; target carrier; trust distinctions; host/admin/
    interaction types; collisions; redaction; wire validation; and caller
    parity.
approved-decisions:
  plaintext-snapshot: >-
    Store at most five optional plaintext values after an explicit carried stage
    grant or an admitted direct/new-apply need. Existing state-directory and
    process-umask behavior applies until apply, abort, or operator removal.
  stage-matrix: >-
    No refs/no flag is Unavailable with zero reads; no refs/explicit flag
    captures five once; refs/no flag fails before interview or state progress;
    refs/flag captures five once. Continue performs no access operation.
  mutable-folder-result: >-
    Current bytes render under the recorded decision: unavailable stays null and
    a captured fixed-five snapshot supplies later-added references. No source or
    program identity refusal is introduced.
  target: >-
    Consume the sole producer CanonicalTarget factory result and StagingError;
    use as_path() only and add no unchecked constructor or consumer normalizer.
out-of-scope: >-
  Runtime or shared canonical edits; arbitrary environment access; a generic
  environment map; a new trust command or digest; a second target normalizer;
  configured-default changes; encryption or new staged-file permissions;
  timeouts; pinned runtime version checks; application subprocesses; or a
  general engine/session redesign.
detail: >-
  Full caller usage, types, source analysis, access matrix, wire, replay,
  compatibility, errors, canonical impact, and proof are in design.md. Targeted
  evidence is in stage-admission-grounding.md, stage-admission-rubric.md,
  stage-admission-candidates/, stage-admission-cross-judge.md, and
  stage-admission-synthesis.md; historical arena evidence remains unchanged.
