$schema: https://refinery.systems/ontology/technical-design
relationships:
  realizes: toha
  implements:
    - template-format
    - command-line-interface
    - interview-protocol
  related-to:
    - architecture
    - project-updates
    - content-injection
    - in-project-generators
    - bundled-demo
objective: >-
  Let one template offer optional parts that a caller selects with `--with` and
  `--without`, record each application in a committed applied record that a
  reader parses as plain JSON, render an update's merge base again from that
  record, and let a template take a JSON document, such as the Intentional
  release model, by its schema URI, so that a release workflow template
  publishes to the targets a repository selects and an organization can read
  which template, revision and parts a repository applied.
terms:
  - part
  - applied-record
  - document-question
design-challenges:
  one-writer-per-file: >-
    A workflow file that two templates edit has two writers, and every update
    must decide whose bytes win. A part is a choice that the template's own
    render reads, not a second template, so the template alone writes every
    file, and ownership, three-way merge and retraction keep their
    single-template rules. Removing a part is an ordinary render without it.
  merge-base-without-stored-bytes: >-
    An update needs the bytes the last apply wrote as its merge base, and the
    applied record holds no file contents. Rendering is deterministic for one
    template revision, one set of answers, one frozen instant and one set of
    host and environment values, so the record keeps each of those inputs and
    the update renders the recorded revision again. A merge base that differs
    from the bytes the apply wrote is worse than none: when it happens to equal
    the project's file, the merge takes the template's bytes and silently
    replaces an operator edit. The record therefore keeps the Git object id of
    every file it owns whole, and a base whose object id differs is never used:
    the path has no base and conflicts. Hook output cannot be rendered again, so
    it is a base only when the repository holds its recorded object.
  one-record-per-repository: >-
    Generators apply one source into many subpaths, and a release template
    applies at the repository root. One record at one known path lets a reader
    find every application without listing the tree. Two branches that change
    one application change the same entry, and their merge conflicts in the
    record.
  identity-readable-without-git: >-
    Airlock reads repositories over the GitHub API and links no Git plumbing and
    no Toha crate. The record is a plain JSON file in the tree with a published
    JSON Schema, so a reader validates it against a vendored copy of that schema
    and needs no ref, no library and no Toha release.
  schemas-before-hosting: >-
    Published schema URIs do not resolve until hosting exists. A template
    vendors each schema it accepts in its schemas directory, so resolution needs
    no network; a fetch serves only a URI that the template does not vendor.
proposed-design:
  high-level-overview: >-
    A template can mark one `multiselect` question as its part question, and
    each option of that question is a part. `--with <PART>` and `--without
    <PART>` settle that question on apply and on update. Every apply that writes
    files into a Git work tree records its application in the applied record
    `.toha.json` at the repository root: template identity, selected parts,
    answers, the frozen instant and path ownership. `apply --update` reads the
    application from the record, renders the recorded revision with the recorded
    answers, parts and host values as the merge base, uses it for a path only
    when it matches the recorded object id, renders the requested revision as
    the candidate, and merges three-way. Candidate construction, merge, conflict
    stages, preview, already-current and the transaction are those of project
    updates. A document question takes a JSON document identified by a schema
    URI, resolved from the template's schemas directory first and fetched
    otherwise. Toha publishes a JSON Schema for the record. Toha creates no Git
    ref, writes no push configuration and never pushes.
  part-declaration: >-
    A question with `parts: true` is the template's part question, and each of
    its options is a part. The question has type `multiselect`; its `options` is
    a literal array of unique strings that each match `^[a-z0-9][a-z0-9_-]*$`;
    and it is a top-level node of `interview` with no `when`, placed before
    every flow node, so that every run reaches it. A template holds at most one
    part question. A second one, `parts: true` on another type, options given as
    an expression, and a part question inside a group, after a flow node or with
    a `when` are load errors. A template without a part question has no parts.
    Toha puts the part question's answer in option order, so one selection
    renders the same bytes however it was given. A part has no files, interview
    or hooks of its own: the template reads the answer by the question's id in
    `when` conditions, file bodies, file paths, `files` rules, `inject` rules
    and hooks, and the template alone writes every file. Hook trust is the
    template's, as for any template. The template contract's optional parts form
    is expressible: its `targets` question gains `parts: true`, and its `when:
    "'npm' in targets"` conditions, the `!include` of each `target.yml` into
    `data`, and the includes written inside `{% if '<target>' in targets %}` are
    unchanged.
  part-selection: >-
    `apply` and `stage` accept `--with <PART>` and `--without <PART>`, each
    repeatable. On a fresh apply, when either is given, the part question's
    answer is its default, with each `--with` part added and each `--without`
    part removed, and the question is not asked; with `--like`, the default is
    the seed application's parts. With neither flag the question is asked and
    answered as any question is. On an update, the answer is the recorded
    `parts` with the same additions and removals, and with neither flag the
    recorded parts replay. `--reanswer` asks the part question again unless
    either flag is given. Toha refuses with a usage error, before any question,
    when the template has no part question, a named part is not an option, one
    part is named by both flags, or an answers document gives the part question
    a value in the same run as either flag. The part question's `required`,
    `validate.min` and `validate.max` apply to the settled answer, and a failure
    is an answer rejection. A recorded part that the new revision no longer
    offers is rejected on replay, as any recorded value that a new revision
    refuses is. The result document and the person summary list the parts added
    and the parts removed.
  part-removal: >-
    A part removed on an update is absent from the candidate render and present
    in the merge base, because the record holds the parts the base used. The
    merge therefore deletes the unmodified whole files only that part planned,
    reports a modify/delete conflict for edited ones, and takes out of a shared
    file the lines only that part rendered, as it does for any template change.
    The part's edit-owned paths follow the existing retraction and release
    rules. A part added on an update is present in the candidate only, so its
    files and lines merge as template additions. Parts need no merge rule of
    their own.
  applied-record: >-
    The applied record is the file `.toha.json` at the root of the target's
    repository. The environment variable `TOHA_RECORD` overrides the path: its
    value is a path relative to the repository root with `/` separators, for
    example `.github/toha.json`, and an absolute path, a `..` component, or a
    path through a symbolic link is a usage error before any question. An apply,
    update or baseline that writes files writes the record in the same
    transaction when the target is inside a Git work tree at the end of the run,
    including a work tree that the run's `git` question initialized; outside a
    work tree it writes no record, and the result document says `not-git`. A
    preview, a dry run, an untrusted plan, a stop and an already-current update
    write no record. The record is one JSON object with two members: `$schema`,
    the record schema's `$id`, and `applications`, an array sorted by `target`
    and then by `source`, in which each pair of `target` and `source` occurs
    once. A target that is not the repository root is named by its application's
    `target`, and that application's `paths` keys stay relative to the target,
    so the one record holds every application in the repository, including each
    subpath a generator writes. A run replaces only the entry for its own source
    and target and keeps every other entry. Toha writes the record as JSON with
    two-space indentation, object keys in sorted order and a final newline. The
    record path is reserved: a planned file, `files` rule or `inject` rule whose
    target is the record is a planning error, and the record is never an owned
    path of any application. The record is not part of the merge: an update
    reads it before rendering and its transaction writes the new entry, and an
    update refuses when the record differs from `HEAD`, as it refuses a dirty
    target. Toha reads a record as JSON and validates it against the record
    schema it ships. A `$schema` that is not that `$id`, a schema failure, a
    repeated pair, and a file that does not parse, such as one that holds merge
    conflict markers, are run errors that name the path, and nothing is written.
    When two branches update one application, the operator keeps one entry in
    the merge, and that entry is what the merged revision holds. An application
    stays in the record until its entry is removed, and removing an entry is an
    operator edit to a committed file.
  application-entry: >-
    Each application holds these members. `target` is the target relative to the
    repository root, `.` for the root. `template` is the formal name the run
    used, with any `@reference`, and `source` is the formal name without its
    reference. `commit` is the resolved 40-hex template commit, or null for a
    template without a Git revision. `content_digest` is optional and holds a
    64-hex lowercase SHA-256 content revision; an application never records both
    a commit and a content digest. `generated` is the frozen render instant,
    which an update carries forward. `parts` lists the selected parts in option
    order, and is empty when the template has no part question. `answers`,
    `context` and `paths` follow.
  record-answers: >-
    `answers` is an object keyed by question id. Each value is that question's
    raw accepted value, in the form an answers document gives it: a looped
    `text` is its array of items, and a `multiselect` answer its array. A
    skipped question, a computed value and a hook result are not answers and are
    not recorded. The part question's answer is `parts` and does not occur in
    `answers`. A document answer is recorded at `answers.<question id>` as the
    whole JSON object the render used, so the merge base renders from that
    document, and an update whose settled document differs from it is never
    already-current; an update's candidate never replays it
    (document-questions). A `git` answer is recorded without the user
    information of its URL, as every output shows it. Answers hold names and
    choices, never secret values: Toha has no secret question type, and a
    template asks for a credential's name, never its value.
  record-context: >-
    `context` is an object keyed by reserved variable name. It holds the value
    the run used for each of `toha_template_aliases`, the seven `toha_host_` and
    `toha_is_` values and the five `toha_env_` values that the template
    references on any render surface, found when the template loads from the
    variables each surface's templates and expressions leave undeclared, `{%
    include %}` partials included. A reserved value that the template does not
    reference is not recorded. `toha_target_name` and the other three
    `toha_template_` values follow from the entry and are not recorded. The
    merge base renders with the recorded values; the candidate renders with the
    updating run's values, and the new entry records those. Toha records these
    values rather than forbid them in templates because forbidding them removes
    a supported capability, such as a file that differs by operating system, and
    because a value that a template renders into a file is already in the
    project. A value that a template reads only in a condition is committed to
    the record and nowhere else; the template author decides what a template
    reads, and Toha reads `toha_env_` values only under trust.
  record-paths: >-
    `paths` maps each path the application owns, relative to the target, to its
    ownership in the ownership forms of project updates: `origin` `toha` for a
    whole file, `edit` with `regions` and `values` for a file Toha edits inside,
    or `hook` for a file a hook created or changed. Toha lists ownership as
    project updates capture it: every path the plan targets, and every path
    under the target that a hook changed, listed after the hooks finish, with
    the same exclusions. Every `toha` and `hook` path also records `blob`, the
    Git object id, in the repository's object format, of the bytes the run left
    at that path in Git stored form, after every hook. An `edit` path records no
    `blob`. An edit path with empty `regions` and `values` is released on the
    next update, as project updates state.
  update-merge-base: >-
    An update renders the merge base from the application's entry: the recorded
    revision, `answers`, `parts`, `generated` and `context`, at the same target,
    with no hooks. The base render submits every recorded answer, document
    answers included, so it renders from the document the last render used. A
    base render that fails, or that leaves a question unanswered, refuses the
    update before any write, names the failure and names `--baseline`. Each
    `toha` and `hook` path takes as its base only bytes whose Git object id
    equals its recorded `blob`: the base render's bytes for a `toha` path when
    their object id equals `blob`, and otherwise the object `blob` names when
    the repository holds it. The base render's bytes are never used when their
    object id differs, and a hook path never takes rendered bytes, because a
    render runs no hooks. A path with no such bytes has no base: when the
    candidate's bytes equal the project's file, the path is unchanged; when the
    candidate has the path and its bytes differ, the path is an add/add
    conflict; and when the candidate removes the path, the path is a
    modify/delete conflict. The project's file stays in the working tree, and
    the candidate's bytes are in the conflict stages. An edit-owned path takes
    the project's `HEAD` bytes: the candidate applies its edits to those same
    bytes, so the merge result is the candidate, operator bytes outside owned
    regions and values are kept, and the injection drift rules decide operator
    changes inside owned bytes. Every other path is the project's `HEAD`, as the
    target outside the base is in project updates. An update therefore never
    replaces an operator edit without a conflict, except an edit to a JSON value
    Toha owns, which converges to the template's value as the injection rules
    state, and an edit inside an owned region, which the drift rules refuse
    unless `--force` is given.
  update-resolution: >-
    `apply TEMPLATE PATH --update` and `stage TEMPLATE PATH --update` update the
    application whose `source` equals TEMPLATE's source and whose `target` is
    PATH. A reference in TEMPLATE selects the candidate revision; without one,
    the source resolves as an apply resolves it. Toha refuses before any
    question when there is no record or no such application, and the message
    names `--baseline`. The merge base needs the recorded revision. Toha fetches
    a recorded commit from the source; when the fetch fails or the source no
    longer has the commit, the update refuses before any question, names the
    source and the commit, and names `--baseline`. A recorded content digest
    resolves only through the content resolver of its source, the bundled demo,
    and only when the available content has that digest; another digest refuses
    in the same way. An application recorded with neither, which an unversioned
    folder template gives, has no reproducible merge base, and its update
    refuses in the same way. Toha never falls back to an empty base: an empty
    base occurs only when the caller names `--baseline`. Each recorded answer
    replays into the candidate except document answers, and of the other
    questions only those that the new revision added are asked; `--answers`
    overrides a recorded answer and `--reanswer` asks every question again. When
    the candidate revision, the settled answers and the settled parts equal the
    entry, the update is already-current and writes nothing, so the record alone
    never makes a render differ. The result document and the person summary name
    the prior and the resolved revision and the parts added and removed.
  baseline: >-
    `apply TEMPLATE PATH --baseline` and `stage TEMPLATE PATH --baseline` adopt
    an existing project: the whole render merges against an empty base, and the
    run writes the application's entry. A repository that holds snapshot refs
    and no record re-baselines this way, and so does an application whose
    recorded revision cannot be rendered again.
  snapshot-fate: >-
    Toha creates, reads and lists no `refs/toha/` ref, and no code reads
    `refs/toha/snapshots/*` to migrate; the operator removes old refs with Git.
    `snapshots list`, `snapshots clean` and `init` are removed: the record is a
    committed file that a person reads and edits directly, and no fetch refspec
    is needed. `--from <SNAPSHOT>` on `apply` and `stage` is replaced by
    `--update`, which takes no value, and `--reanswer` requires `--update`.
    `--baseline` stays, as baseline states. `--like` selects its seed by target:
    its value is the `target` of an application of the same source in the
    record, and a bare `--like` on the person route lists those applications to
    pick from. `latest` and snapshot ids are not selectors, because the record
    keeps one entry per application and orders no entry by time. A seeded result
    names the seed target. Base selection reads the record; no listing marks a
    likely base.
  staging-and-protocol: >-
    A staged update or baseline holds a copy of the application entry it started
    from, or of the empty base, and its `--with` and `--without` parts, so
    `continue` and `apply PATH` render the same merge base. `apply PATH` refuses
    when the record's entry for that application differs from the copy, and the
    message names `stage --update`. A staged fresh apply holds its part flags in
    the same way, and a staged `--like` apply holds a copy of the seed entry's
    answers and parts. A question batch that holds the part question lists the
    parts as its options. `--answers` documents and question batches otherwise
    keep the interview protocol.
  document-questions: >-
    A document question has `type: document` and takes a JSON object. `schema`
    is a URI, or a list of URIs, naming each JSON Schema the question accepts.
    `input`, which is required, names the question's default file: a literal
    relative path, resolved against the target, that stays inside the target's
    repository, or inside the target when it is in no repository. A missing
    `input` is a load error. `apply` and `stage` accept `--input FILE`,
    repeatable, and `continue PATH --input FILE` submits one to a staged
    interview. Each reads a contract document: a JSON object whose `$schema`
    member is a URI. Toha submits it to every document question that accepts
    that URI, compared by exact string equality and never by template formal
    name. An input that no question accepts is a usage error. On every apply,
    update, stage and preview, a document question takes the first of: an input
    it accepts, an answers document's value for its id, and the file named by
    `input`, read from the working tree at the start of the run. A document
    validates against the resolved schema whose URI equals its `$schema`, or
    against the question's only schema when the document has no `$schema`. A
    file that is not a JSON object, whose `$schema` the question does not
    accept, or that fails its schema is refused in the same way as an invalid
    input: the error names the path, nothing is written, and Toha does not ask
    for another file. A document answer is recorded in `answers`, so the record
    holds the document the render used, and the merge base renders from it, but
    an update's candidate never replays a recorded document answer. When none of
    the three is present, the question is unanswered: a person is asked for a
    file path with `input` as the default, and a script or agent receives the
    question in a question batch.
  schema-resolution: >-
    `schemas` in `template.yml` names the template's schemas directory, relative
    to the template root and outside the source subdirectory. Toha reads every
    file in it and in its subdirectories whose extension is `.json`, `.yml` or
    `.yaml`, parses it as JSON or YAML by that extension, and indexes it by its
    top-level `$id`. A file without a string `$id`, a file that does not parse,
    and two files with one `$id` are load errors that name the files; a file
    with another extension is not read. When the template loads, Toha resolves
    every URI that a document question names, and every `$ref` that a resolved
    schema makes to another resource. A URI resolves to the indexed file whose
    `$id` equals it, compared by exact string equality, and otherwise to an
    HTTPS fetch of the URI. A fetch reads at most 1 MiB, parses the body as
    JSON, and requires the body's `$id` to equal the URI. A URI that is not
    `https`, a failed fetch, a body that is not a JSON Schema, and a body whose
    `$id` differs are run errors that name the URI. They occur before any
    question, and nothing is written. Toha keeps no copy of a fetched schema.
    The fetch uses the TLS configuration of HTTPS template sources and adds no
    timeout of its own. The schema fetch is Toha's only network read apart from
    template sources. Hosted URIs, for example
    `https://intentional.foo/schemas/release-model/1`, do not resolve until
    hosting exists, so vendoring is the working path, and until then a template
    that names a schema it does not vendor fails to load.
  record-schema: >-
    Toha publishes a JSON Schema for the applied record. Its `$id` is
    `https://wyrd.foo/toha/schemas/applied-record/1`, its repository path is
    `docs/specifications/applied-record-1.schema.yml`, and
    `docs/specifications/applied-record.yml` specifies the record. A record's
    `$schema` member equals that `$id`. The schema defines the members that
    applied-record, application-entry, record-answers, record-context and
    record-paths name. A published schema URI is immutable and never changes
    what it describes: a change to the schema publishes the next line,
    `applied-record/2`, at its own path, and the file for each earlier line
    stays. Toha writes and reads line `1`. The URI does not resolve until
    hosting exists; a reader vendors a copy, and a test in the reader's
    repository compares the copy with the Toha release it names.
  identity-reading: >-
    A reader audits one project revision. It reads the record at the path it
    expects, the repository root unless it is configured otherwise, parses it as
    JSON, and validates it against a vendored copy of the record schema whose
    `$id` equals the record's `$schema`. Each application gives the target,
    source, formal name, revision, parts and answers that the revision holds.
    The record is part of the tree, so an apply made on a branch that never
    merged is absent from the revision, and an application stays until its entry
    is removed; a reader can report an application whose target is absent from
    the tree. The reader needs no Git plumbing, no Toha crate and no ref. Toha
    ships no reader library; the schema is the contract.
  release-model-agreement: >-
    This design and the Intentional release model design agree on these points.
    The release model document carries its schema URI, including its line, in a
    top-level `$schema` member, and Toha routes the document to document
    questions by exact string equality with that URI, never by template formal
    name. A document question that reads the model names
    `.intentional/release-model.json` as its `input`. A template accepts a line
    by naming its URI, `https://intentional.foo/schemas/release-model/1` for
    line `1`, in the question's `schema` and by vendoring that schema in its
    schemas directory; a template that accepts two lines names both and branches
    on `$schema`. Toha reads the committed model on every run and never replays
    a recorded one. The record holds the model the process was rendered from as
    the recorded answer to that document question, at `answers.<question id>`,
    which is `answers.release_model` in the release template. A comparison of
    that value with the committed `.intentional/release-model.json` shows a
    process that needs an update, and an update that renders from a different
    model is never already-current. Toha holds no release model types,
    Intentional never runs Toha, and Toha never runs Intentional.
  out-of-scope: >-
    More than one part question in a template, parts with their own interview,
    files or hook trust, extension of a template by another template without a
    fork, YAML typed edits, `--like` across sources, a secrets facility, a copy
    of fetched schemas, migration from `refs/toha/snapshots/*`, and pushing.
    Toha writes no push configuration.
