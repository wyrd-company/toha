$schema: https://refinery.systems/ontology/technical-design
relationships:
  realizes: toha
  implements:
    - template-format
    - interview-protocol
    - config
    - template-registry
    - command-line-interface
    - applied-record
  related-to:
    - bundled-demo
    - template-defaults
    - error-attribution
    - confirm-flow
    - headless-recovery
    - jinja-context
    - jinja-includes
    - hook-results
    - content-injection
    - project-updates
    - in-project-generators
    - template-composition
    - hook-review-trust
    - installed-trust
objective: >-
  Structure the toha crate and binary so that one pure interview engine serves
  the terminal, the JSON interview protocol, headless answers files, and crate
  callers; so that every external input is parsed once into domain types; and
  so that the fixture suite exercises the whole system through the same
  interfaces its callers use.
design-challenges:
  one-engine-many-drivers: >-
    Terminal prompts, `stage --async`, `continue` with a file or with prompts,
    `apply --answers`, and crate callers all drive the same interview, and one
    interview moves between them. The engine holds every interview rule; the
    drivers hold only presentation.
  typed-jinja: >-
    The same YAML string is a template in one field and an expression in
    another, depending on the field type. The distinction is made once, when
    the template loads, and every later stage works with compiled values whose
    kind is fixed.
  resumable-state: >-
    A staged interview resumes in a later process, possibly in the other
    modality, and must produce the same answers and output as an uninterrupted
    run.
  safe-output: >-
    No rendered path leaves the target directory or enters `.git`. A fresh
    apply requires force for whole-file collisions. Bounded injections and
    three-way project updates enforce their ownership rules; prior edit-owned
    region drift requires the current invocation's force choice before ownership
    transitions. Prior edit-owned paths becoming whole-owned conflict on differing
    outside bytes even with region force. Hooks require trust.
proposed-design:
  high-level-overview: >-
    One Cargo package named `toha` holds a library and a binary. The library
    is the crate other applications embed. The binary is a thin shell built
    behind the default `cli` feature, so crate callers compile without the
    command-line and prompt dependencies. The library is organized around the
    domain: templates, interviews, plans, sources, the registry,
    configuration, and staging. Each is a deep module with a small interface.
    Every file, argument, environment variable, and network response is parsed
    into domain types at the module that reads it; code behind that point
    trusts the types. The interview engine is pure: it performs no I/O and reads no clock or
    environment. The planner reads only the template folder and the target
    directory listing.

  module-map: >-
    `template` loads a template folder into a `Template`.
    `interview` runs the interview state machine over a `Template`.
    `plan` turns a completed interview into a `Plan` of files, hooks, and
    messages. `apply` executes a `Plan` against the target directory.
    `protocol` converts between engine values and the interview protocol
    documents. `source` parses template addresses and fetches git templates
    with gitoxide. `registry` reads and writes `templates.yml` layers and
    resolves a template argument. `config` reads and merges configuration
    layers. `staging` stores staged interviews. `applied` reads and writes the
    applied record, opens a project's repository, captures ownership, and merges
    a template update from its recorded application entry. `jinja` owns the
    minijinja environment, the compiled value types, and the toha filters; it is
    private to the library. `resolve` combines source fetching, caching and
    pinned template selection with explicit caller paths. `catalog` owns installed
    template transactions and returns structured events. `operations` owns
    application context, session documents, owned replay and application plans.
    Preparation admits requirements and documents before environment capture;
    Session owns advancement, accepted progress and abort cleanup. Reconstruction
    restores recorded documents without reading new input files; explicit document
    admission follows state inspection. The binary drives these same lifecycle
    methods for fresh, staged and scripted operations;
    `updates` prepares and finishes baseline and recorded-application updates.
    UpdateSession retains staged state on preview, trust refusal and failure, and
    consumes it after a real successful merge. Pinned-application admission
    precedes acquisition of new configuration and clock inputs.
    `bundled` and `assets` expose embedded templates and guidance without terminal
    dependencies. The binary holds argument and environment interpretation, the
    terminal prompt driver, output formatting and exit-code mapping.

    A caller carries the serializable StagedRecord between requests, including
    its pinned template/base identity, frozen context and admitted documents.
    Loaded operations rebuild borrowed interviews inside one request. Owned
    request inputs and results are Send. A loaded Git-bound update retains a
    thread-local repository and stays within a blocking worker; callers construct,
    consume and drop it there. The caller supplies HookRunner on each apply.
    Operations emit no terminal output themselves; hook runners and the existing
    Git transport retain their own I/O contracts.

    The `applied` module opens the target's repository once through gitoxide
    (gix features: worktree-mutation, revision, sha1, status, merge) and removes
    every configured merge and filter driver from the in-memory configuration so
    no driver program starts during status, checkout, conversion, or merge. The
    applied record is `.toha.json` at the repository root; TOHA_RECORD overrides
    its repository-relative path. It records applications keyed by source and
    target. Each entry holds raw accepted answers, parts, frozen render time,
    referenced render context
    and ownership; whole-file and hook paths require a stored blob id and Git
    mode. The module renders the merge base from the recorded revision and
    inputs without hooks. Whole-file bytes must match the recorded blob or come
    from its retained object; hook paths use only retained objects. Base entries
    use recorded mode, never HEAD's mode. Missing base bytes preserve operator
    files and conflict when candidate bytes differ or the path is removed.
    The candidate tree uses a throwaway checkout and merges three-way into the
    working tree under an index lock, with the new record entry written in the
    same transaction. Toha creates, reads and lists no `refs/toha/` ref and
    migrates no legacy ref contents; `--baseline` explicitly re-baselines a
    project against an empty merge base. The update replay adapter drives the
    interview engine from an application's recorded answers and is crate-private;
    the command driver reaches it through the `drive_update`/`drive_update_resume`
    seam, which returns the adapter's typed outcome over already-public interview
    types. `StagedRecord` carries optional `base` and `reanswer` members for a
    staged update. No gitoxide type appears in a public signature.

  template-module: >-
    `Template::load(folder: &Path) -> Result<Template, LoadError>` is the only
    entry point. It reads `template.yml`, resolves `!include` tags inside the
    template root, validates the document against the template-format schema
    embedded from `docs/specifications/template-format.schema.yml`, and
    deserializes it into raw serde types that mirror the schema. It then
    builds the domain model and runs the semantic checks from the template
    format specification: unique identifiers, references only to earlier ids,
    and paths inside the template root. `LoadError` carries every problem
    found, each with the YAML path of the offending value, so an author fixes
    all of them in one pass. The raw serde types never leave the module.

  template-model: >-
    The domain model makes the format rules unrepresentable to violate.
    `Id` is a newtype built only by parsing an identifier. A question is
    `Question { id, prompt, description, placeholder, required, kind, validate,
    format, when }`, where `kind` is a sum type: `Text { default: Option<Tmpl> }`, `TextLoop { default:
    Option<Typed<Vec<String>>>, min: Option<Typed<u32>>, max:
    Option<Typed<u32>> }`, `Multiline { default: Option<Tmpl> }`,
    `Confirm { default: Option<Typed<bool>> }`, `Select { options:
    Typed<Vec<String>>, default: Option<Tmpl> }`, and `MultiSelect { options:
    Typed<Vec<String>>, default: Option<Typed<Vec<String>>> }`.
    A loop exists only on text, and options exist only on the two select
    kinds, because no other variant has the field. Nodes are the sum type
    `Node::{Question, Computed, Group, Message, Hook, Flow}`, each with an optional
    `when`. File generation rules, the ignore and static glob sets, the
    top-level hooks, and the two apply messages complete the `Template`.

  typed-jinja-values: >-
    The `jinja` module compiles every Jinja value at load time into one of
    three types. `Tmpl` is a compiled template that renders to a `String`.
    `Expr` is a compiled expression that evaluates to a minijinja value.
    `Typed<T>` is `Literal(T)` or `Expr(Expr)` and evaluates to `T`, failing
    with a typed error when the expression result does not convert to `T`.
    The loader picks the type from the field's value type in the schema:
    string fields become `Tmpl`; boolean, integer, and array fields become
    `Typed<bool>`, `Typed<u32>`, and `Typed<Vec<String>>`; `when`, `computed`,
    and `format` become `Expr`. Each compiled value records the ids it
    references, taken from minijinja's undeclared-variable analysis, which
    drives both the reference-order check and the batch boundary. The
    `jinja::environment()` function registers the case filters, `toyaml`,
    `now()`, and `dateformat` for every compiled value.

  interview-engine: >-
    The engine is a state machine whose states are values:
    `Interview::start(template: &Template, seed: Seed) -> Result<Interview,
    EvalError>` and
    `enum Interview { Asking(Pending), Complete(Completed), Ended(Ended) }`. `Seed` holds
    ordinary flat defaults, the frozen instant that `now()` returns and an
    explicit invocation context.
    Configured defaults enter through an origin-bearing `Resolution`; its
    consuming start and staged-replay routes keep each winning mapping and
    preset origin beside the value until constraints pass. Converting a
    resolution to flat defaults is an explicit provenance-dropping operation.
    `Pending::batch(&self) -> &Batch` exposes the current batch.
    `Pending::messages_reached(&self) -> usize` counts messages reached through
    that batch in `Completed.messages` order.
    `Pending::check(&self, id, RawAnswer) -> Result<Answer, CheckError>`
    validates and formats one answer without recording it. It returns
    `CheckError::Rejected` for answer rules and `CheckError::Eval` for
    evaluation failures, so the terminal driver reports an error as soon as
    a question is answered.
    `Pending::answer(self, answers: RawAnswers) -> Result<Interview,
    AnswerError>` records a whole document or nothing. It checks valid current
    answers in a private tentative walk to classify known-invalid early answers
    as active, skipped, or unresolved. The tentative walk publishes no effect;
    an accepted document performs one fresh committed walk. `AnswerError::Rejected`
    returns the same pending state and the per-id rejections.
    `AnswerError::Eval` reports a Jinja evaluation failure without recording
    answers. `EvalError` names the node id, the prompt, description, or default
    field, and the minijinja error message.
    Answers for ids beyond the batch are held and applied when their questions
    are reached. The engine evaluates computed, message, and hook nodes as
    soon as their references are answered, applies the skipped-question
    default rule, and stops at the first node that references an unanswered
    id. A `Batch` is an ordered list of `Item::Prompt(Prompt)` and
    `Item::Message(String)` in interview order, where a `Prompt` is the
    rendered question: id, kind, title, description, placeholder, default,
    options, and constraints. `Completed` holds the flat `Answers`, the
    rendered interview hooks in order, and the messages shown.

  generate-axis: >-
    The generate axis (`--like TARGET`) seeds a new application's defaults from
    an application of the same source. The CLI-side boundary `src/cli/like.rs`
    selects through `applied::Project::applications()`, validates source identity
    and matches a repository-relative target. A bare flag lets the person route
    pick an application; other routes require a target. The boundary converts the
    entry's raw answers into `ApplicationSeed` and retains the target as provenance.
    Application and repository types stop at this boundary; the engine consumes
    raw defaults. The engine seam is
    `Resolution::start_with_seed(template, now, context, Option<ApplicationSeed>) ->
    Result<(Interview, Vec<warning>), EvalError>`, a sibling of
    `start_with_context`; with `None` it follows the ordinary configured start.
    The seam builds the single-occupant default bank: a kind-matching
    `DefaultBankEntry::Application { raw, from }`, mirrored by
    `PreparedDefaultSource::Application { from }`, shadows the configured entry.
    A wrong-kind value is dropped with a warning, revealing the configured or
    template fallback. Explicit route answers win over seeded defaults. Staging
    records the selected target in `seed` and copies the entry in `seed_entry`,
    including answers and parts. Resume uses that copy without rereading the live
    application. The seed stays separate from an update's copied base entry.

  answers: >-
    `Answer` is `Text(String)`, `Bool(bool)`, `List(Vec<String>)`, `None`, or
    `Value(serde_json::Value)`. `Answers` is an ordered map from `Id` to `Answer`. `RawAnswer` is the
    untyped input from a driver: a string typed at a prompt, or a JSON value
    from an answers document. `Pending::check` is the single parse point from
    `RawAnswer` to `Answer` for the question's kind, followed by validation
    and the `format` expression. The engine exposes answers to Jinja by
    converting `Answers` to a minijinja context, together with the template
    data and computed values.

  drivers: >-
    Drivers call the engine; the engine never calls a driver, so there is no
    prompt port. The terminal driver in the binary walks the `Batch` items,
    prints messages, asks each prompt with inquire, calls `check` after each
    answer, and submits the batch with `answer`. An empty submission ends a
    loop prompt. The `protocol` module converts a `Batch` into the batch document
    and its JSON Schema, and converts the engine's response into the result
    documents. An external answers document reaches the engine only through the
    private identity gate `parse_and_verify`: it parses the two-field envelope
    `{"template", "answers"}` and compares the declared `template` with the
    formal name the route established, by exact string equality, before it
    yields the raw answers as a private `VerifiedSubmission`. `answer_document_once`
    (one step, for `continue PATH FILE`) and `answer_document_headless` (the
    scripted walk, for `apply TEMPLATE PATH --answers FILE`) consume that gate;
    there is no public parser from external JSON to `RawAnswers`, so external
    JSON cannot reach the engine without passing the identity comparison. The
    in-memory crate path is separate: terminal prompting, staged replay, and
    crate callers build `RawAnswers` directly and drive `Pending::answer` or
    `answer_headless` without the envelope.

  staging: >-
    Staged records persist invocation inputs: the canonical target text,
    selected formal identity and content version, originating context, frozen
    time and ordered accepted raw submissions. Optional base and reanswer members
    describe an update: base copies the application entry or marks an empty
    baseline, and staged apply refuses a changed live application entry. The
    seed and seed_entry members carry generator provenance and the copied
    application. Store validates the target against the producer-created
    CanonicalTarget. Replay loads the recorded named/Git
    version or current mutable folder, restores recorded context inside the
    record, resolves live configured defaults and submits accepted values through
    the shared engine. Legacy context-free records retain the legacy projection.
    Hook trust is evaluated when applying the resulting plan; replay itself reads
    no environment or approval. Persistence uses a temporary file and rename in
    the state directory. Canonical storage keys precede validated legacy separator
    keys; saving the canonical key removes the legacy key.

  plan-and-apply: >-
    `Plan::build(template: &Template, completed: &Completed, target:
    &CanonicalTarget) ->
    Result<Plan, PlanError>` renders retained compiled file bodies and paths and
    reads the target directory listing. It performs no target-content mutation. A `Plan` holds
    `PlannedFile { path: TargetPath, content: Content }`, where `Content` is
    `Rendered(String)` or `Copied(PathBuf)`; the conflicts with existing
    files; the ordered hook commands, interview hooks first; and ready or deferred
    apply messages. Hook-result readers defer rendering to ordered apply.
    `TargetPath` is a newtype built only by a constructor that
    normalizes a rendered relative path and rejects `..` escapes, absolute
    paths, and any path inside `.git`, so no later code checks for them.
    A `Plan` also holds `edits: Vec<PlannedEdit>`, the bounded content-injection
    edits, where `PlannedEdit` is `Region(PlannedRegionEdit)` or
    `JsonValue(PlannedJsonEdit)`. `Plan::build` renders each `inject` rule to an
    edit — resolving the marker style or JSON format, rejecting a JSON-family
    marker rule, and rejecting a duplicate region key or an overlapping typed
    path — but reads no target bytes. Two pure resolvers,
    `resolve_region_edit(current: Option<&[u8]>, edit) -> Result<EditResolution,
    RegionError>` and `resolve_json_edit(current, edit) -> Result<EditResolution,
    JsonEditError>`, each return a complete candidate file as
    `Unchanged`, `Write(Vec<u8>)`, or `Drift { forced }` and perform no I/O; the
    region resolver checksums its owned span with `sha2`, and the JSON resolver
    edits the `jsonc-parser` concrete syntax tree so unrelated source is kept.
    `Plan::mutations() -> impl Iterator<Item = FileMutation>` derives the
    ownership view `FileMutation::{Whole, Region, JsonValue}` that the project-
    update design consumes.
    `Plan::apply(self, target: &CanonicalTarget, options: ApplyOptions,
    runner: &dyn HookRunner) ->
    Result<Applied, ApplyError>` refuses to write when conflicts exist
    without `force`, returns `Applied::NeedsTrust(Plan)` without writing when
    the plan has hooks and `options.trusted` is false, and otherwise resolves
    every injected target in memory before the first write — starting from the
    whole-file image when a rule supplies one, otherwise the current bytes read
    once, and folding the target's edits in source order — so an unforced region
    drift, a parse or path error, or a missing target leaves every file
    unchanged. It then writes each whole file, replaces each changed injected
    target atomically through a sibling temporary file, reports each changed
    target once, and runs the hooks in order, stopping at the first failure.
    A dry run is `Plan::build` followed by classifying each edit against its
    target's current bytes and printing the plan.

  hook-runner: >-
    `HookRunner` is the one port in the library, with two adapters: the
    process adapter runs the argument vector directly with
    `std::process::Command`, no shell, in the hook working directory; the
    recording adapter used by tests records each command and returns a
    configured status. Hook order, conditions, and failure handling are
    therefore tested without depending on platform commands.

  sources-and-registry: >-
    `source` parses a template argument into the sum type
    `Address::{Git { repo, reference, path }, Folder(PathBuf), Name(String)}`
    using the order in the command-line specification and the merged host
    prefixes, and renders the formal name of an address. It clones and
    fetches with gitoxide into the user templates path. `registry` merges the
    `templates.yml` layers and exposes `Registry::resolve(&self, name) ->
    Result<Entry, ResolveError>`, where `ResolveError::Ambiguous` carries
    every matching formal name so the binary prints the `templates alias`
    commands. `add`, `update`, `remove`, and `alias` are methods on the user
    layer that return the new layer. The catalog service combines them with
    source installation and writes the user registry atomically, returning
    structured events for the caller to render.

  configuration-boundary: >-
    The binary resolves every environment variable and platform directory
    once, into a `Dirs` value holding the configuration, data, state, and
    system paths, and passes it to `config`, `registry`, and `staging`. The
    orchestration library receives those paths and the caller's working
    directory explicitly. Existing TOHA_RECORD overrides, PATH executable lookup
    and Git global configuration (including HOME/XDG) remain part of lower-level
    contracts. Explicit Toha paths do not establish process isolation. `config::load(&Dirs, cwd) ->
    Result<Config, ConfigError>` validates each layer against the embedded
    configuration schema and merges them by the rules in the configuration
    specification. `ConfigEntry<T>` keeps each winning value and origin
    together. `configured_defaults` is the sole consumer that translates those
    entries into an origin-bearing `Resolution`; callers report its warnings
    before consuming it through configured start or replay.

  outcomes-and-exit-codes: >-
    Command adapters map domain outcomes and errors to the exit codes in the command-line
    specification: success 0, errors 1, usage 2, `NeedsTrust` 3, a pending
    batch 4, and `ResolveError::Ambiguous` 5.

  schemas-as-source: >-
    The JSON Schemas in `docs/specifications/` are embedded with
    `include_str!` and validated at runtime with the `jsonschema` crate. The
    protocol driver builds batch documents that validate against the embedded
    interview protocol schema. A test validates every example in
    `docs/examples/` and every fixture against the same embedded schemas, so
    the specifications and the implementation share one definition.

  dependencies: >-
    minijinja for Jinja; heck for case conversion; gix for git; serde with
    serde_json and toml for data; serde_norway for YAML, whose tagged values
    carry `!include` into the loader; jsonschema for schema validation; globset for ignore and
    static globs; sha2 for staged file names; etcetera for platform
    directories; clap for arguments and inquire for prompts behind the `cli`
    feature; include_dir for library-accessible embedded skills and the bundled
    demo; and dist for
    release installers.

  fixture-suite: >-
    Each fixture is a directory under `tests/fixtures/` holding a `template/`
    folder, an `answers.json`, an `expected/` output tree, and an
    `expect.yml` with the exit code, messages, and recorded hook commands.
    One library-level harness loads the template, drives the engine with the
    answers through the protocol driver, builds and applies the plan into a
    temporary directory with the recording hook runner and a fixed clock, and
    compares the tree with `expected/`. A second harness replays the same
    fixtures in batches through staging to prove resumption produces the same
    result. A command-line harness runs the binary against a subset to cover
    argument parsing and exit codes. Error fixtures hold an `expect.yml`
    with the expected error instead of an `expected/` tree.
