# ---
# relationships:
#   realizes: command-line-interface
# ---
$schema: https://commonclischema.org/draft/2026-04/schema
tool:
  name: toha
  mode: interactive
  summary: Generate projects and files from templates.
options:
  - name: version
    flags: [ -V, --version ]
    kind: flag
    description: >-
      Print `toha <VERSION>` and exit with code 0. `<VERSION>` is the SemVer
      version of the build.
commands:
  - name: event
    summary: Fire a named event for all recorded applications in a repository.
    positional-arguments:
      - name: name
        position: 0
        required: true
        description: Event name declared by templates.
        value:
          type: string
      - name: path
        position: 1
        required: false
        description: Directory inside the repository; defaults to the current directory.
        value:
          type: directory
    options:
      - name: trust
        flags: [ --trust ]
        kind: flag
        description: Permit recorded templates to run event handlers.
      - name: dry-run
        flags: [ --dry-run ]
        kind: flag
        description: Prepare and validate all handlers without executing them.
  - name: stage
    summary: Run the interview for a template and save the answers without writing files.
    mode: interactive
    notes:
      - Multiline input uses an editor, or lines ending with . when no editor is available.
    positional-arguments:
      - name: template
        position: 0
        required: true
        description: Alias, short name, formal name, git address, or folder of the template.
        value:
          type: string
      - name: path
        position: 1
        required: true
        description: Target directory.
        value:
          type: directory
    options:
      - name: input
        flags: [ --input ]
        kind: option
        description: Read a JSON contract document and route by its exact $schema URI. Repeatable.
        value:
          type: path
      - name: async
        flags: [ -a, --async ]
        kind: option
        value-optional: true
        description: >-
          Emit the first question batch instead of prompting (the agent route).
          With a file, writes the batch to the file and the instructions to
          standard output; without a file, writes the batch and the instructions
          to standard output.
        value:
          type: path
      - name: trust
        flags: [ --trust ]
        kind: flag
        description: >-
          Capture the trusted environment values (user, hostname, editor, shell,
          visual) this staged interview's templates reference. The grant is
          discovered before any batch and carries through every later batch and
          the apply.
      - name: with
        flags: [ --with ]
        kind: option
        description: >-
          Repeatable. Add a part to the default selection on a fresh apply, the
          seed selection with --like, or the recorded selection on update.
          Settles the part question even with --reanswer. The settled answer
          must meet the question constraints.
        value:
          type: string
      - name: without
        flags: [ --without ]
        kind: option
        description: >-
          Repeatable. Remove a part from the same selection as --with. Reject
          unknown parts, a part named by both flags, a template without parts,
          or a part answer supplied with either flag, before any question.
          Stage preserves the flags and their selection through resume.
        value:
          type: string
      - name: update
        flags: [ --update ]
        kind: flag
        conflicts-with: [ baseline ]
        description: >-
          Update the application's source and target from its applied record.
          Replay its recorded answers and merge the requested revision against
          a verified merge base. Requires a clean target and record. A missing
          entry or unreproducible revision names --baseline.
      - name: baseline
        flags: [ --baseline ]
        kind: flag
        description: Stage an update from an empty base.
      - name: reanswer
        flags: [ --reanswer ]
        kind: flag
        requires: [ update ]
        description: Re-ask every recorded answer instead of replaying it.
      - name: like
        flags: [ --like ]
        kind: option
        conflicts-with: [ update, baseline ]
        description: >-
          Seed defaults from an application of the same source at the named
          repository-relative target. A bare flag opens a person-route picker;
          other routes require a target. Staging copies the entry's answers and
          parts. Seeded result documents name the seed target.
        value:
          type: string
          required: false
    output:
      modes:
        - name: human-readable
          description: >-
            The person route: interactive prompts and messages, then the dry-run
            plan and apply instructions at completion.
          machine-readable: false
        - name: batch-and-instructions
          description: >-
            The agent route selected by --async: the interview protocol batch
            followed by plain-text instructions (with a file argument, the batch
            is written to the file and only the instructions to standard output).
          machine-readable: true
      exit-codes:
        - code: 0
          meaning: >-
            The interview is complete and staged, or a flow stop/abort ended it
            (with `--async`, the `ended` result document is emitted; an abort
            leaves nothing staged).
        - code: 1
          meaning: >-
            The template failed to load, or an interview is already staged at
            the path; the message names the commands that finish or replace it.
            Or a `--like` selector could not be honoured while staging (it is
            resolved and pinned at stage time) — unknown, ambiguous, wrong-source,
            no application of the source, or a target not in git with an explicit
            selector — reported as an `error` document of kind `record`.
        - code: 2
          meaning: >-
            Invalid command line, or --input has no string $schema, an
            unaccepted URI, or a duplicate route (exit 2).
        - code: 4
          meaning: The interview is staged and a question batch was emitted.
        - code: 5
          meaning: The template name is ambiguous.
  - name: continue
    summary: Continue a staged interview with an answers document or terminal prompts.
    mode: interactive
    notes:
      - Multiline input uses an editor, or lines ending with . when no editor is available.
    positional-arguments:
      - name: path
        position: 0
        required: true
        description: Target directory of the staged interview.
        value:
          type: directory
      - name: answers
        position: 1
        required: false
        description: >-
          Identity-bearing answers document for the current batch, wrapping the
          answers in `{"template": <formal>, "answers": {...}}`; `-` reads
          standard input (the agent route). When absent, toha prompts in the
          terminal for every remaining question (the person route) and shows the
          dry-run plan at completion.
        value:
          type: path
    options:
      - name: input
        flags: [ --input ]
        kind: option
        description: Read a JSON contract document and route by its exact $schema URI. Repeatable.
        value:
          type: path
    output:
      modes:
        - name: human-readable
          description: >-
            The person route (no answers document): interactive prompts and
            messages, then the dry-run plan and apply instructions at completion.
          machine-readable: false
        - name: batch-and-instructions
          description: >-
            The agent route (with an answers document): the next question-batch
            document followed by plain-text instructions while questions remain,
            or the completion instructions only when the interview completes.
          machine-readable: true
      exit-codes:
        - code: 0
          meaning: >-
            With an answers document the interview completed and only the
            completion instructions (naming `apply PATH --dry-run` and `apply
            PATH`) were written; without one, prompting completed and the dry-run
            plan was shown. A flow stop/abort also ended it: with an answers
            document the `ended` result document carries the `kind`; an abort
            leaves nothing staged. There is no complete result document.
        - code: 1
          meaning: >-
            No interview is staged at the path, or an answers document was given
            for a complete interview, or for an interview a flow node already
            ended; the message names the commands that fit. Or the staged record
            does not replay against its template; the message states that the
            staged interview cannot be resumed and why, and names `abort`
            followed by `stage`. Or an expression in the template failed to
            evaluate while answering; the message starts with `template error
            in` and names the field and the expression. Or the staged record
            copied an invalid `--like` application; the staged interview cannot be
            resumed and an `error` document of kind `record` is reported. A seed
            removed from the live applied record still resumes from its copy.
        - code: 2
          meaning: An --input has no string $schema, an unaccepted URI, or a duplicate route.
        - code: 4
          meaning: Questions remain or answers were rejected; the result holds the batch.
  - name: apply
    summary: Write the files of a staged or new interview and run its hooks.
    mode: interactive
    notes:
      - Multiline input uses an editor, or lines ending with . when no editor is available.
    positional-arguments:
      - name: template
        position: 0
        required: false
        description: >-
          Template to interview (the person route, `apply TEMPLATE PATH`): it
          prompts the remaining questions in a terminal and applies, resuming an
          interview of the same template staged at the path. With `--answers` the
          same command is the scripted route (below). `apply PATH` without a
          template is the agent route, which never prompts.
        value:
          type: string
      - name: path
        position: 1
        required: true
        description: Target directory.
        value:
          type: directory
    options:
      - name: input
        flags: [ --input ]
        kind: option
        description: Read a JSON contract document and route by its exact $schema URI. Repeatable.
        value:
          type: path
      - name: dry-run
        flags: [ -d, --dry-run ]
        kind: flag
        description: Print the files, messages, and hooks apply would produce, and change nothing.
      - name: trust
        flags: [ --trust ]
        kind: flag
        description: Run the hooks of this template for this run.
      - name: force
        flags: [ -f, --force ]
        kind: flag
        description: Overwrite existing files or replace drifted managed regions.
      - name: answers
        flags: [ -A, --answers ]
        kind: option
        description: >-
          Identity-bearing answers document for the scripted route `apply
          TEMPLATE PATH --answers FILE`, wrapping the answers in `{"template":
          <formal>, "answers": {...}}`; `-` reads standard input. One shot: it
          never stages and refuses, before reading the document, when an
          interview is staged at the path.
        value:
          type: path
      - name: with
        flags: [ --with ]
        kind: option
        description: >-
          Repeatable. Add a part to the default selection on a fresh apply, the
          seed selection with --like, or the recorded selection on update.
          Settles the part question even with --reanswer. The settled answer
          must meet the question constraints.
        value:
          type: string
      - name: without
        flags: [ --without ]
        kind: option
        description: >-
          Repeatable. Remove a part from the same selection as --with. Reject
          unknown parts, a part named by both flags, a template without parts,
          or a part answer supplied with either flag, before any question.
          Stage preserves the flags and their selection through resume.
        value:
          type: string
      - name: update
        flags: [ --update ]
        kind: flag
        conflicts-with: [ baseline ]
        description: >-
          Update the application's source and target from its applied record.
          Replay its recorded answers and merge the requested revision against
          a verified merge base. Requires a clean target and record. A missing
          entry or unreproducible revision names --baseline.
      - name: baseline
        flags: [ --baseline ]
        kind: flag
        description: >-
          Update from an empty base: merge the whole render into the target,
          three-way against nothing, adopting an existing project and recording
          its application entry.
      - name: reanswer
        flags: [ --reanswer ]
        kind: flag
        requires: [ update ]
        description: Re-ask every recorded answer instead of replaying it.
      - name: like
        flags: [ --like ]
        kind: option
        conflicts-with: [ update, baseline ]
        description: >-
          Seed defaults from an application of the same source at the named
          repository-relative target. A bare flag opens a person-route picker;
          other routes require a target. Staging copies the entry's answers and
          parts. Seeded result documents name the seed target.
        value:
          type: string
          required: false
    output:
      modes:
        - name: human-readable
          description: >-
            The person route (`apply TEMPLATE PATH`) and the applied agent route
            (`apply PATH` on a complete interview): prompts and messages as
            needed, each written path as its file is written, then hook output.
            Updates (--update or --baseline) print template and target, merge actions
            and conflict kinds, messages, allowed hook failures, applied record outcome,
            preview or already-current notices, and conflict resolution guidance.
            They emit no JSON completion document.
          machine-readable: false
        - name: batch-and-instructions
          description: >-
            The agent route `apply PATH` on an incomplete interview: the current
            question-batch document followed by plain-text instructions, with
            exit code 4. It never prompts, with or without a terminal.
          machine-readable: true
        - name: result
          description: >-
            The scripted route `apply TEMPLATE PATH --answers FILE`: exactly one
            JSON result document on standard output for every outcome — `applied`,
            `planned`, `questions`, `error`, or `ended` — and nothing else. An
            uncaptured hook's stdout is forwarded to standard error so the result
            document stays alone on standard output. A plain apply's `applied`
            document carries a `record` member; an update (`--update` or
            `--baseline`) carries a `record` and a `merge` member, and reports
            `already-current` when the re-render equals the base.
          machine-readable: true
      exit-codes:
        - code: 0
          meaning: >-
            Files were written and every hook succeeded (the scripted route emits
            the `applied` document; the person and agent routes print the file
            lines), or a dry run completed (the scripted route emits the `planned`
            document; other routes print the plan). An untrusted project update
            previews without writing and exits 0; scripted updates emit planned
            with trusted: false, while person and staged-agent updates print
            completion prose and trust guidance on standard output. A flow
            stop/abort ended a fresh generation; or a flow
            dry-run showed the plan: the scripted route emits the
            `ended` or `planned` document and other routes print a one-line notice
            on standard error; nothing is written and an abort removes the staged
            record.
        - code: 1
          meaning: >-
            A file conflict, render failure, or hook failure; no interview is
            staged at the path; an interview for another template is staged at
            the path; the scripted route found an interview already staged (an
            `error` document of kind `staged`); a flow abort could not remove the
            staged record; a flow stop/abort ended a one-shot project update
            (--update or --baseline), which reports the ended interview as an
            error without writing; the staged record does not replay against its
            template, and the message names `abort` followed by `stage`; or a
            `--like` selector could not be honoured — unknown, ambiguous,
            wrong-source, no application of the source, or a target not in git with
            an explicit selector — reported as an `error` document of kind
            `record`; or a program the template `requires` is not on `PATH`,
            reported before the first question, and as an `error` document of
            kind `requirement` on the scripted route. The scripted route
            reports every failure as an `error`
            result document; the person and agent routes report on standard
            error.
        - code: 2
          meaning: >-
            Invalid command line: a bare `--like` without a selector on the
            script or agent route (a selector is required off the person route),
            or `--like` combined with `--update` or `--baseline`; or an `--input`
            has no string `$schema`, an unaccepted URI, or a duplicate route.
            Scripted input usage errors retain kind `input` in the error document.
        - code: 3
          meaning: >-
            A plain application (without --update or --baseline) has hooks and is
            not trusted. The scripted route emits a
            `planned` document with `trusted: false`; the person and agent routes
            print the plan and name the `--trust` command on standard error.
        - code: 4
          meaning: >-
            The interview is incomplete: `apply PATH` (the agent route) reports
            the current batch with instructions without prompting, and the
            scripted route emits a `questions` document.
        - code: 5
          meaning: >-
            The template name is ambiguous; the scripted route emits an `error`
            document of kind `ambiguous` listing the matches.
