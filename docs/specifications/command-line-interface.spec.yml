# ---
# relationships:
#   realizes: command-line-interface
# ---
$schema: https://commonclischema.org/draft/2026-04/schema
tool:
  name: toha
  mode: interactive
  summary: Generate projects and files from templates.
options:
  - name: version
    flags: [ -V, --version ]
    kind: flag
    description: >-
      Print `toha <VERSION>` and exit with code 0. `<VERSION>` is the SemVer
      version of the build.
commands:
  - name: stage
    summary: Run the interview for a template and save the answers without writing files.
    mode: interactive
    notes:
      - Multiline input uses an editor, or lines ending with . when no editor is available.
    positional-arguments:
      - name: template
        position: 0
        required: true
        description: Alias, short name, formal name, git address, or folder of the template.
        value:
          type: string
      - name: path
        position: 1
        required: true
        description: Target directory.
        value:
          type: directory
    options:
      - name: async
        flags: [ -a, --async ]
        kind: option
        value-optional: true
        description: >-
          Emit the first question batch instead of prompting (the agent route).
          With a file, writes the batch to the file and the instructions to
          standard output; without a file, writes the batch and the instructions
          to standard output.
        value:
          type: path
    output:
      modes:
        - name: human-readable
          description: >-
            The person route: interactive prompts and messages, then the dry-run
            plan and apply instructions at completion.
          machine-readable: false
        - name: batch-and-instructions
          description: >-
            The agent route selected by --async: the interview protocol batch
            followed by plain-text instructions (with a file argument, the batch
            is written to the file and only the instructions to standard output).
          machine-readable: true
      exit-codes:
        - code: 0
          meaning: >-
            The interview is complete and staged, or a flow stop/abort ended it
            (with `--async`, the `ended` result document is emitted; an abort
            leaves nothing staged).
        - code: 1
          meaning: >-
            The template failed to load, or an interview is already staged at
            the path; the message names the commands that finish or replace it.
        - code: 2
          meaning: Invalid command line.
        - code: 4
          meaning: The interview is staged and a question batch was emitted.
        - code: 5
          meaning: The template name is ambiguous.
  - name: continue
    summary: Continue a staged interview with an answers document or terminal prompts.
    mode: interactive
    notes:
      - Multiline input uses an editor, or lines ending with . when no editor is available.
    positional-arguments:
      - name: path
        position: 0
        required: true
        description: Target directory of the staged interview.
        value:
          type: directory
      - name: answers
        position: 1
        required: false
        description: >-
          Identity-bearing answers document for the current batch, wrapping the
          answers in `{"template": <formal>, "answers": {...}}`; `-` reads
          standard input (the agent route). When absent, toha prompts in the
          terminal for every remaining question (the person route) and shows the
          dry-run plan at completion.
        value:
          type: path
    output:
      modes:
        - name: human-readable
          description: >-
            The person route (no answers document): interactive prompts and
            messages, then the dry-run plan and apply instructions at completion.
          machine-readable: false
        - name: batch-and-instructions
          description: >-
            The agent route (with an answers document): the next question-batch
            document followed by plain-text instructions while questions remain,
            or the completion instructions only when the interview completes.
          machine-readable: true
      exit-codes:
        - code: 0
          meaning: >-
            With an answers document the interview completed and only the
            completion instructions (naming `apply PATH --dry-run` and `apply
            PATH`) were written; without one, prompting completed and the dry-run
            plan was shown. A flow stop/abort also ended it: with an answers
            document the `ended` result document carries the `kind`; an abort
            leaves nothing staged. There is no complete result document.
        - code: 1
          meaning: >-
            No interview is staged at the path, or an answers document was given
            for a complete interview, or for an interview a flow node already
            ended; the message names the commands that fit. Or the staged record
            does not replay against its template; the message states that the
            staged interview cannot be resumed and why, and names `abort`
            followed by `stage`. Or an expression in the template failed to
            evaluate while answering; the message starts with `template error
            in` and names the field and the expression.
        - code: 4
          meaning: Questions remain or answers were rejected; the result holds the batch.
  - name: apply
    summary: Write the files of a staged or new interview and run its hooks.
    mode: interactive
    notes:
      - Multiline input uses an editor, or lines ending with . when no editor is available.
    positional-arguments:
      - name: template
        position: 0
        required: false
        description: >-
          Template to interview (the person route, `apply TEMPLATE PATH`): it
          prompts the remaining questions in a terminal and applies, resuming an
          interview of the same template staged at the path. With `--answers` the
          same command is the scripted route (below). `apply PATH` without a
          template is the agent route, which never prompts.
        value:
          type: string
      - name: path
        position: 1
        required: true
        description: Target directory.
        value:
          type: directory
    options:
      - name: dry-run
        flags: [ -d, --dry-run ]
        kind: flag
        description: Print the files, messages, and hooks apply would produce, and change nothing.
      - name: trust
        flags: [ --trust ]
        kind: flag
        description: Run the hooks of this template for this run.
      - name: force
        flags: [ -f, --force ]
        kind: flag
        description: Overwrite existing files.
      - name: answers
        flags: [ -A, --answers ]
        kind: option
        description: >-
          Identity-bearing answers document for the scripted route `apply
          TEMPLATE PATH --answers FILE`, wrapping the answers in `{"template":
          <formal>, "answers": {...}}`; `-` reads standard input. One shot: it
          never stages and refuses, before reading the document, when an
          interview is staged at the path.
        value:
          type: path
    output:
      modes:
        - name: human-readable
          description: >-
            The person route (`apply TEMPLATE PATH`) and the applied agent route
            (`apply PATH` on a complete interview): prompts and messages as
            needed, each written path as its file is written, then hook output.
          machine-readable: false
        - name: batch-and-instructions
          description: >-
            The agent route `apply PATH` on an incomplete interview: the current
            question-batch document followed by plain-text instructions, with
            exit code 4. It never prompts, with or without a terminal.
          machine-readable: true
        - name: result
          description: >-
            The scripted route `apply TEMPLATE PATH --answers FILE`: exactly one
            JSON result document on standard output for every outcome — `applied`,
            `planned`, `questions`, `error`, or `ended` — and nothing else. An
            uncaptured hook's stdout is forwarded to standard error so the result
            document stays alone on standard output.
          machine-readable: true
      exit-codes:
        - code: 0
          meaning: >-
            Files were written and every hook succeeded (the scripted route emits
            the `applied` document; the person and agent routes print the file
            lines), or a dry run completed (the scripted route emits the `planned`
            document; other routes print the plan). A flow stop/abort ended the
            run or a flow dry-run showed the plan: the scripted route emits the
            `ended` or `planned` document and other routes print a one-line notice
            on standard error; nothing is written and an abort removes the staged
            record.
        - code: 1
          meaning: >-
            A file conflict, render failure, or hook failure; no interview is
            staged at the path; an interview for another template is staged at
            the path; the scripted route found an interview already staged (an
            `error` document of kind `staged`); a flow abort could not remove the
            staged record; or the staged record does not replay against its
            template, and the message names `abort` followed by `stage`. The
            scripted route reports every failure as an `error` result document;
            the person and agent routes report on standard error.
        - code: 3
          meaning: >-
            The template has hooks and is not trusted. The scripted route emits a
            `planned` document with `trusted: false`; the person and agent routes
            print the plan and name the `--trust` command on standard error.
        - code: 4
          meaning: >-
            The interview is incomplete: `apply PATH` (the agent route) reports
            the current batch with instructions without prompting, and the
            scripted route emits a `questions` document.
        - code: 5
          meaning: >-
            The template name is ambiguous; the scripted route emits an `error`
            document of kind `ambiguous` listing the matches.
  - name: abort
    summary: Delete the staged interview for a target directory.
    mode: non-interactive
    positional-arguments:
      - name: path
        position: 0
        required: true
        description: Target directory of the staged interview.
        value:
          type: directory
    output:
      exit-codes:
        - code: 0
          meaning: The staged interview was deleted, or none existed.
  - name: templates
    summary: Manage installed templates.
    subcommands:
      - name: add
        summary: Install every template in a repository, or the one template at `#<path>`.
        mode: non-interactive
        positional-arguments:
          - name: address
            position: 0
            required: true
            description: Git address or local folder.
            value:
              type: string
        options:
          - name: alias
            flags: [ -a, --alias ]
            kind: option
            description: >-
              Alias for the template. Fails when the address holds more than one template.
            value:
              type: string
          - name: trust
            flags: [ --trust ]
            kind: flag
            description: Approve the added templates' current hooks in the user registry.
        output:
          exit-codes:
            - code: 0
              meaning: The templates were installed; shared short names are reported.
            - code: 1
              meaning: >-
                The address holds no template, the clone failed, or --alias was given for more than
                one template.
      - name: list
        summary: List available templates with formal name, short name, aliases, and trust.
        mode: non-interactive
        options:
          - name: local
            flags: [ -l, --local ]
            kind: flag
            description: Only templates from the local layer.
          - name: system
            flags: [ -s, --system ]
            kind: flag
            description: Only templates from the system layer.
          - name: user
            flags: [ -u, --user ]
            kind: flag
            description: Only templates from the user layer.
          - name: json
            flags: [ --json ]
            kind: flag
            description: Print the list as JSON.
        groups:
          - name: layer
            members: [ local, system, user ]
            rule: mutually-exclusive
        output:
          modes:
            - name: human-readable
              machine-readable: false
            - name: json
              machine-readable: true
      - name: update
        summary: Move installed git templates that follow a branch to its newest commit.
        mode: non-interactive
        positional-arguments:
          - name: template
            position: 0
            required: false
            description: Template to update. All installed git templates when absent.
            value:
              type: string
        output:
          exit-codes:
            - code: 0
              meaning: Every selected template is at the newest commit of its branch.
            - code: 1
              meaning: A fetch failed, or no installed template matches.
            - code: 5
              meaning: The template name is ambiguous.
      - name: remove
        summary: Uninstall a template and delete its entry from the user registry.
        mode: non-interactive
        positional-arguments:
          - name: template
            position: 0
            required: true
            description: Template to uninstall.
            value:
              type: string
        output:
          exit-codes:
            - code: 0
              meaning: The template was removed.
            - code: 1
              meaning: No installed template matches.
            - code: 5
              meaning: The template name is ambiguous.
      - name: alias
        summary: Add or remove an alias in the user registry.
        mode: non-interactive
        positional-arguments:
          - name: template
            position: 0
            required: false
            description: Formal or short name of the template.
            value:
              type: string
          - name: alias
            position: 1
            required: false
            description: Alias to add.
            value:
              type: string
        options:
          - name: remove
            flags: [ -r, --remove ]
            kind: option
            description: Alias to remove.
            value:
              type: string
        groups:
          - name: add-alias
            members: [ template, alias ]
            rule: all-or-none
          - name: operation
            members: [ template, remove ]
            rule: exactly-one
        notes:
          - An alias that equals a short name of another template is added with a warning.
        output:
          exit-codes:
            - code: 0
              meaning: The alias was added or removed.
            - code: 1
              meaning: The alias is in use, or the alias to remove does not exist.
            - code: 5
              meaning: The template name is ambiguous.
      - name: trust
        summary: Approve the installed hooks of a template so its apply runs them.
        mode: non-interactive
        positional-arguments:
          - name: template
            position: 0
            required: true
            description: Formal, short, or alias name of an installed template.
            value:
              type: string
        output:
          exit-codes:
            - code: 0
              meaning: Trust was granted, or was already granted.
            - code: 1
              meaning: >-
                The template is not in the user registry, or its installed executable surface is
                missing, unreadable, or escapes the template folder.
            - code: 2
              meaning: Invalid command line.
            - code: 5
              meaning: The template name is ambiguous.
      - name: untrust
        summary: Revoke approval of a template's hooks.
        mode: non-interactive
        positional-arguments:
          - name: template
            position: 0
            required: true
            description: Formal, short, or alias name of an installed template.
            value:
              type: string
        output:
          exit-codes:
            - code: 0
              meaning: Trust was revoked, or was already absent.
            - code: 1
              meaning: The template is not in the user registry.
            - code: 2
              meaning: Invalid command line.
            - code: 5
              meaning: The template name is ambiguous.
  - name: skills
    summary: Read the agent skills embedded in toha.
    subcommands:
      - name: list
        summary: List the embedded skills as JSON objects with name and description.
        mode: non-interactive
        output:
          modes:
            - name: json
              machine-readable: true
      - name: view
        summary: Print the SKILL.md of a skill, or another file of it.
        mode: non-interactive
        positional-arguments:
          - name: name
            position: 0
            required: true
            description: Name of the skill.
            value:
              type: string
        options:
          - name: path
            flags: [ -p, --path ]
            kind: option
            description: Path of a file inside the skill.
            value:
              type: path
          - name: export
            flags: [ -e, --export ]
            kind: option
            description: Write the whole skill directory to `<PATH>/<NAME>/`.
            value:
              type: directory
        groups:
          - name: target
            members: [ path, export ]
            rule: mutually-exclusive
