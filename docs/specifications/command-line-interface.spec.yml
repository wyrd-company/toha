# ---
# relationships:
#   realizes: command-line-interface
# ---
$schema: https://commonclischema.org/draft/2026-04/schema
tool:
  name: toha
  mode: interactive
  summary: Generate projects and files from templates.
options:
  - name: version
    flags: [ -V, --version ]
    kind: flag
    description: >-
      Print `toha <VERSION>` and exit with code 0. `<VERSION>` is the SemVer
      version of the build.
commands:
  - name: stage
    summary: Run the interview for a template and save the answers without writing files.
    mode: interactive
    notes:
      - Multiline input uses an editor, or lines ending with . when no editor is available.
    positional-arguments:
      - name: template
        position: 0
        required: true
        description: Alias, short name, formal name, git address, or folder of the template.
        value:
          type: string
      - name: path
        position: 1
        required: true
        description: Target directory.
        value:
          type: directory
    options:
      - name: async
        flags: [ -a, --async ]
        kind: option
        value-optional: true
        description: >-
          Emit the first question batch instead of prompting. Writes to the
          given file, or to standard output when no file is given.
        value:
          type: path
    output:
      modes:
        - name: human-readable
          description: Interactive prompts and messages.
          machine-readable: false
        - name: question-batch
          description: The interview protocol batch selected by --async.
          machine-readable: true
      exit-codes:
        - code: 0
          meaning: The interview is complete and staged.
        - code: 1
          meaning: >-
            The template failed to load, or an interview is already staged at
            the path; the message names the commands that finish or replace it.
        - code: 2
          meaning: Invalid command line.
        - code: 4
          meaning: The interview is staged and a question batch was emitted.
        - code: 5
          meaning: The template name is ambiguous.
  - name: continue
    summary: Continue a staged interview with an answers document or terminal prompts.
    mode: interactive
    notes:
      - Multiline input uses an editor, or lines ending with . when no editor is available.
    positional-arguments:
      - name: path
        position: 0
        required: true
        description: Target directory of the staged interview.
        value:
          type: directory
      - name: answers
        position: 1
        required: false
        description: >-
          Answers document for the current batch; `-` reads standard input.
          When absent, toha prompts in the terminal for every remaining
          question, or emits the complete result document when none remain.
        value:
          type: path
    output:
      modes:
        - name: human-readable
          description: Interactive prompts and messages, when no answers document is given.
          machine-readable: false
        - name: result
          description: >-
            The interview protocol result document, when an answers document is
            given or the interview is complete.
          machine-readable: true
      exit-codes:
        - code: 0
          meaning: The interview is complete.
        - code: 1
          meaning: >-
            No interview is staged at the path, or an answers document was given
            for a complete interview; the message names the commands that fit.
        - code: 4
          meaning: Questions remain or answers were rejected; the result holds the batch.
  - name: apply
    summary: Write the files of a staged or new interview and run its hooks.
    mode: interactive
    notes:
      - Multiline input uses an editor, or lines ending with . when no editor is available.
    positional-arguments:
      - name: template
        position: 0
        required: false
        description: >-
          Template to interview when no interview is staged at the path. When
          given, the command runs `stage` and then applies. When an interview
          for the same template is staged at the path, the command applies it
          as `apply <PATH>` does.
        value:
          type: string
      - name: path
        position: 1
        required: true
        description: Target directory.
        value:
          type: directory
    options:
      - name: dry-run
        flags: [ -d, --dry-run ]
        kind: flag
        description: Print the files, messages, and hooks apply would produce, and change nothing.
      - name: trust
        flags: [ --trust ]
        kind: flag
        description: Run the hooks of this template for this run.
      - name: force
        flags: [ -f, --force ]
        kind: flag
        description: Overwrite existing files.
      - name: answers
        flags: [ -A, --answers ]
        kind: option
        description: >-
          Answers document for a new interview, or for the staged interview of
          the named template; `-` reads standard input.
        value:
          type: path
    output:
      modes:
        - name: human-readable
          description: Prompts, messages, written paths, and hook output.
          machine-readable: false
        - name: question-batch
          description: >-
            The interview protocol batch on standard output, with exit code 4,
            when the interview is incomplete and no terminal can prompt for it. The commands that answer the
            remaining questions are named on standard error.
          machine-readable: true
      exit-codes:
        - code: 0
          meaning: Files were written and every hook succeeded, or the dry run completed.
        - code: 1
          meaning: >-
            A file conflict, render failure, or hook failure; no interview is
            staged at the path; an interview for another template is staged at
            the path; or an answers document was given for a complete
            interview.
        - code: 3
          meaning: The template has hooks and is not trusted; a dry run was printed.
        - code: 4
          meaning: >-
            The interview is incomplete and no terminal can prompt for it;
            standard output holds the question batch.
        - code: 5
          meaning: The template name is ambiguous.
  - name: abort
    summary: Delete the staged interview for a target directory.
    mode: non-interactive
    positional-arguments:
      - name: path
        position: 0
        required: true
        description: Target directory of the staged interview.
        value:
          type: directory
    output:
      exit-codes:
        - code: 0
          meaning: The staged interview was deleted, or none existed.
  - name: templates
    summary: Manage installed templates.
    subcommands:
      - name: add
        summary: Install every template in a repository, or the one template at `#<path>`.
        mode: non-interactive
        positional-arguments:
          - name: address
            position: 0
            required: true
            description: Git address or local folder.
            value:
              type: string
        options:
          - name: alias
            flags: [ -a, --alias ]
            kind: option
            description: >-
              Alias for the template. Fails when the address holds more than one template.
            value:
              type: string
          - name: trust
            flags: [ --trust ]
            kind: flag
            description: Record the added templates as trusted in the user registry.
        output:
          exit-codes:
            - code: 0
              meaning: The templates were installed; shared short names are reported.
            - code: 1
              meaning: >-
                The address holds no template, the clone failed, or --alias was given for more than
                one template.
      - name: list
        summary: List available templates with formal name, short name, aliases, and trust.
        mode: non-interactive
        options:
          - name: local
            flags: [ -l, --local ]
            kind: flag
            description: Only templates from the local layer.
          - name: system
            flags: [ -s, --system ]
            kind: flag
            description: Only templates from the system layer.
          - name: user
            flags: [ -u, --user ]
            kind: flag
            description: Only templates from the user layer.
          - name: json
            flags: [ --json ]
            kind: flag
            description: Print the list as JSON.
        groups:
          - name: layer
            members: [ local, system, user ]
            rule: mutually-exclusive
        output:
          modes:
            - name: human-readable
              machine-readable: false
            - name: json
              machine-readable: true
      - name: update
        summary: Move installed git templates that follow a branch to its newest commit.
        mode: non-interactive
        positional-arguments:
          - name: template
            position: 0
            required: false
            description: Template to update. All installed git templates when absent.
            value:
              type: string
        output:
          exit-codes:
            - code: 0
              meaning: Every selected template is at the newest commit of its branch.
            - code: 1
              meaning: A fetch failed, or no installed template matches.
            - code: 5
              meaning: The template name is ambiguous.
      - name: remove
        summary: Uninstall a template and delete its entry from the user registry.
        mode: non-interactive
        positional-arguments:
          - name: template
            position: 0
            required: true
            description: Template to uninstall.
            value:
              type: string
        output:
          exit-codes:
            - code: 0
              meaning: The template was removed.
            - code: 1
              meaning: No installed template matches.
            - code: 5
              meaning: The template name is ambiguous.
      - name: alias
        summary: Add or remove an alias in the user registry.
        mode: non-interactive
        positional-arguments:
          - name: template
            position: 0
            required: false
            description: Formal or short name of the template.
            value:
              type: string
          - name: alias
            position: 1
            required: false
            description: Alias to add.
            value:
              type: string
        options:
          - name: remove
            flags: [ -r, --remove ]
            kind: option
            description: Alias to remove.
            value:
              type: string
        groups:
          - name: add-alias
            members: [ template, alias ]
            rule: all-or-none
          - name: operation
            members: [ template, remove ]
            rule: exactly-one
        notes:
          - An alias that equals a short name of another template is added with a warning.
        output:
          exit-codes:
            - code: 0
              meaning: The alias was added or removed.
            - code: 1
              meaning: The alias is in use, or the alias to remove does not exist.
            - code: 5
              meaning: The template name is ambiguous.
  - name: skills
    summary: Read the agent skills embedded in toha.
    subcommands:
      - name: list
        summary: List the embedded skills as JSON objects with name and description.
        mode: non-interactive
        output:
          modes:
            - name: json
              machine-readable: true
      - name: view
        summary: Print the SKILL.md of a skill, or another file of it.
        mode: non-interactive
        positional-arguments:
          - name: name
            position: 0
            required: true
            description: Name of the skill.
            value:
              type: string
        options:
          - name: path
            flags: [ -p, --path ]
            kind: option
            description: Path of a file inside the skill.
            value:
              type: path
          - name: export
            flags: [ -e, --export ]
            kind: option
            description: Write the whole skill directory to `<PATH>/<NAME>/`.
            value:
              type: directory
        groups:
          - name: target
            members: [ path, export ]
            rule: mutually-exclusive
