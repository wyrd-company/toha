# ---
# relationships:
#   realizes: interview-protocol
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://wyrd.foo/toha/schemas/interview-protocol
title: Toha Interview Protocol
description: >-
  The answers document callers submit, and the result documents toha emits. The
  question batch, the scripted result documents (applied, planned, error), and
  the flow-ended document are the `oneOf` a route writes to standard output; the
  answers document is the input a caller supplies.
oneOf:
  - $ref: "#/$defs/batch"
  - $ref: "#/$defs/ended"
  - $ref: "#/$defs/applied"
  - $ref: "#/$defs/planned"
  - $ref: "#/$defs/error"
$defs:
  identifier:
    type: string
    pattern: '^[a-z_][a-z0-9_]*$'
  answers:
    description: Answers keyed by question id.
    type: object
    propertyNames:
      $ref: "#/$defs/identifier"
  answers-document:
    description: >-
      The external answers document a caller submits. It names the template it
      answers, which toha compares by exact string equality with the formal
      template the route established before it evaluates any answer.
    type: object
    additionalProperties: false
    required: [ template, answers ]
    properties:
      template:
        description: Exact formal template name copied from context.template.
        type: string
        minLength: 1
      answers:
        $ref: "#/$defs/answers"
  context:
    type: object
    additionalProperties: false
    required: [ target, template, commit ]
    properties:
      target:
        description: >-
          Canonical absolute target path, without a redundant trailing
          separator except when the path is a filesystem root.
        type: string
      template:
        description: Formal name of the template.
        type: string
      commit:
        description: Resolved commit of a git template; null for a local folder.
        type: [ string, "null" ]
  messages:
    description: >-
      Messages reached by the step that produced the document, in interview
      order. A warning from toha starts with `warning: `.
    type: array
    items:
      type: string
  action:
    description: >-
      How a planned or written path is produced: `create` a new whole file,
      `overwrite` an existing one, refuse it as a `conflict` in a dry run, or
      `inject`/`update` a region or value of a target.
    enum: [ create, overwrite, conflict, inject, update ]
  snapshot_outcome:
    description: >-
      What the apply did about its snapshot: the `id` it saved, the reason it
      `skipped` the save, or a capture `error` after the files were written.
    type: object
    additionalProperties: false
    properties:
      id:
        type: string
      skipped:
        enum: [ not-git, no-commit, dirty, nothing-changed, dry-run ]
      error:
        type: string
    oneOf:
      - required: [ id ]
      - required: [ skipped ]
      - required: [ error ]
  batch:
    type: object
    additionalProperties: false
    required: [ protocol, status, context, schema, messages ]
    properties:
      protocol:
        const: 1
      status:
        const: questions
      context:
        $ref: "#/$defs/context"
      schema:
        description: JSON Schema 2020-12 object schema of the pending questions.
        type: object
        required: [ type, properties ]
        properties:
          type:
            const: object
      messages:
        $ref: "#/$defs/messages"
      errors:
        description: >-
          Validation errors keyed by question id: for the answers of a rejected
          document, for held answers that failed when their questions were
          reached, for a recoverable configured default, and, on the scripted
          route, `is required` for a required question the document left
          unanswered. Each error is a sentence that states the failed constraint.
        type: object
        propertyNames:
          $ref: "#/$defs/identifier"
        additionalProperties:
          type: array
          items:
            type: string
  applied:
    description: >-
      The scripted route wrote the files and ran the hooks. Each written path
      carries its action; each hook that ran carries its id, exit code, and
      success. Captured hook streams never appear here.
    type: object
    additionalProperties: false
    required: [ protocol, status, context, files, messages, hooks, snapshot ]
    properties:
      protocol:
        const: 1
      status:
        const: applied
      context:
        $ref: "#/$defs/context"
      files:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [ path, action ]
          properties:
            path:
              type: string
            action:
              $ref: "#/$defs/action"
      messages:
        $ref: "#/$defs/messages"
      hooks:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [ id, exit_code, success ]
          properties:
            id:
              type: [ string, "null" ]
            exit_code:
              type: [ integer, "null" ]
            success:
              type: boolean
      snapshot:
        $ref: "#/$defs/snapshot_outcome"
  planned:
    description: >-
      The scripted route planned the files and hooks and wrote nothing (a CLI or
      flow dry run, or untrusted hooks). Each planned path carries its action and
      the region or JSON path an edit governs; each planned hook carries its
      rendered argument vector and cwd. `trusted` states whether the hooks would
      run.
    type: object
    additionalProperties: false
    required: [ protocol, status, context, files, messages, hooks, trusted ]
    properties:
      protocol:
        const: 1
      status:
        const: planned
      context:
        $ref: "#/$defs/context"
      files:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [ path, action ]
          properties:
            path:
              type: string
            action:
              $ref: "#/$defs/action"
            owner:
              description: The region key or JSON path an edit governs.
              type: string
      messages:
        $ref: "#/$defs/messages"
      hooks:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [ command, cwd ]
          properties:
            command:
              type: array
              items:
                type: string
            cwd:
              type: string
      trusted:
        type: boolean
  error:
    description: >-
      The scripted route refused the request or a step failed. `kind` names the
      failure class, `message` states it, and `commands` lists the commands that
      finish, discard, or retry the request when there are any. `context` is
      present once the route established a target and template.
    type: object
    additionalProperties: false
    required: [ protocol, status, kind, message ]
    properties:
      protocol:
        const: 1
      status:
        const: error
      kind:
        enum:
          - input
          - document
          - identity
          - staged
          - source
          - replay
          - conflict
          - render
          - hook
          - ambiguous
      message:
        type: string
      commands:
        type: array
        items:
          type: string
      context:
        $ref: "#/$defs/context"
  ended:
    description: >-
      A flow `stop` or `abort` ended the interview. No files were written and no
      hooks ran; an `abort` additionally removed the target's staged record.
    type: object
    additionalProperties: false
    required: [ protocol, status, context, kind, messages ]
    properties:
      protocol:
        const: 1
      status:
        const: ended
      context:
        $ref: "#/$defs/context"
      kind:
        description: Whether the flow node stopped the run or also discarded the staged record.
        enum: [ stop, abort ]
      label:
        description: The diagnostic label of the flow node that ended the interview.
        type: string
      messages:
        $ref: "#/$defs/messages"
