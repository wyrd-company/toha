# ---
# relationships:
#   realizes: interview-protocol
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://wyrd.foo/toha/schemas/interview-protocol
title: Toha Interview Protocol
description: Documents exchanged by `stage --async`, `continue`, and `--answers`.
oneOf:
  - $ref: "#/$defs/batch"
  - $ref: "#/$defs/complete"
$defs:
  identifier:
    type: string
    pattern: '^[a-z_][a-z0-9_]*$'
  answers:
    description: Answers keyed by question id.
    type: object
    propertyNames:
      $ref: "#/$defs/identifier"
  context:
    type: object
    additionalProperties: false
    required: [ target, template, commit ]
    properties:
      target:
        description: >-
          Canonical absolute target path, without a redundant trailing
          separator except when the path is a filesystem root.
        type: string
      template:
        description: Formal name of the template.
        type: string
      commit:
        description: Resolved commit of a git template; null for a local folder.
        type: [ string, "null" ]
  messages:
    description: >-
      Messages reached by the step that produced the document, in interview
      order. A warning from toha starts with `warning: `.
    type: array
    items:
      type: string
  batch:
    type: object
    additionalProperties: false
    required: [ protocol, status, context, schema, messages ]
    properties:
      protocol:
        const: 1
      status:
        const: questions
      context:
        $ref: "#/$defs/context"
      schema:
        description: JSON Schema 2020-12 object schema of the pending questions.
        type: object
        required: [ type, properties ]
        properties:
          type:
            const: object
      messages:
        $ref: "#/$defs/messages"
      errors:
        description: >-
          Validation errors keyed by question id: for the answers of a rejected
          document, for held answers that failed when their questions were
          reached, or for a recoverable configured default with its winning
          source. Each error is a sentence that states the failed constraint.
        type: object
        propertyNames:
          $ref: "#/$defs/identifier"
        additionalProperties:
          type: array
          items:
            type: string
  complete:
    type: object
    additionalProperties: false
    required: [ protocol, status, context, answers, messages ]
    properties:
      protocol:
        const: 1
      status:
        const: complete
      context:
        $ref: "#/$defs/context"
      answers:
        $ref: "#/$defs/answers"
      messages:
        $ref: "#/$defs/messages"
