# ---
# relationships:
#   realizes: template-registry
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://wyrd.foo/toha/schemas/template-registry
title: Toha Template Registry
description: The `templates.yml` registry of one configuration layer.
$defs:
  alias:
    type: string
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
  aliases:
    type: array
    uniqueItems: true
    items:
      $ref: "#/$defs/alias"
  entry:
    type: object
    additionalProperties: false
    required: [ name, source, path ]
    properties:
      name:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      source:
        type: string
      ref:
        type: string
      commit:
        type: string
        pattern: '^[0-9a-f]{40}([0-9a-f]{24})?$'
      path:
        type: string
      aliases:
        $ref: "#/$defs/aliases"
      approval:
        description: >-
          The approved executable-surface digest. Approval authorizes the
          template's hooks only while its live digest still equals this value.
        type: string
        pattern: '^sha256:[0-9a-f]{64}$'
      trusted:
        description: >-
          A legacy boolean. `false` denies the template's hooks: it clears any
          approval inherited from a lower registry layer, so the entry reads as
          needing review, and it is written back so the denial survives a
          round-trip. `true` is ignored and grants nothing. New writes emit only
          `false`, and only to record a denial.
        type: boolean
  registry:
    type: object
    additionalProperties: false
    properties:
      templates:
        type: object
        description: Entries keyed by formal template name.
        additionalProperties:
          $ref: "#/$defs/entry"
  local-registry:
    type: object
    additionalProperties: false
    properties:
      templates:
        type: object
        description: Aliases keyed by formal template name.
        additionalProperties:
          type: object
          additionalProperties: false
          properties:
            aliases:
              $ref: "#/$defs/aliases"
