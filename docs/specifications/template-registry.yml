$schema: https://refinery.systems/ontology/specification
relationships:
  realizes:
    - toha
description: >-
  Defines the template registry: the record of installed templates, their
  aliases, and their trust. `docs/specifications/template-registry.schema.yml`
  is the machine-readable definition.

  Layers. Each configuration layer has one registry file named `templates.yml`.
  The system registry is `/usr/local/share/toha/templates.yml` on Linux and
  macOS and `%PROGRAMDATA%\toha\templates.yml` on Windows. The user registry is
  `$XDG_DATA_HOME/toha/templates.yml` on Linux, with `~/.local/share` in place
  of `$XDG_DATA_HOME` when it is unset, empty, or relative;
  `~/Library/Application Support/toha/templates.yml` on macOS; and
  `%APPDATA%\toha\templates.yml` on Windows. The command-line interface
  specification defines how toha reads these directory variables. The local
  registry is `templates.yml` in the first templates path of the local layer,
  `.templates/templates.yml` unless configured. A missing file is an empty
  registry. Entries merge by formal name, and fields from the layer
  with higher precedence win: local over user over system.

  Entries. `templates` maps a formal template name to its entry. `name` is the
  short name from the template's `template.yml`. `source` is the repository URL
  of a git template or the canonical absolute path of a local folder template.
  `ref` is the ref from the address, when one was given. `commit` is the
  resolved commit of the installed content of a git template. `path` is the
  directory that holds the template: the install directory of a git template,
  or the folder itself for a local folder template. `aliases` lists alias
  names. `approval` is the approved executable-surface digest; it lets the
  template's hooks run without `--trust` only while the installed content still
  matches that digest. `trusted: false` records a denial, written by
  `templates untrust` or carried by a legacy registry: it clears any approval a
  lower registry layer grants for the same formal name, so the entry reads as
  needing review. A legacy `trusted: true` is ignored and grants nothing.

  Ownership. `templates add`, `templates update`, `templates remove`,
  `templates alias`, `templates trust`, and `templates untrust` write the user
  registry. `templates trust` records an approval and `templates untrust` clears
  it and records a denial, without fetching or moving the installed commit. The
  system registry is provisioned by the system administrator. The local registry
  holds aliases only, so trust never comes from a project.

  Discovery. A template found by scanning a templates path without a registry
  entry has the canonical absolute path of its folder as its formal name, and
  carries no approval.

  Listing output. `templates list` writes a tab-separated text table with the
  columns `FORMAL NAME`, `SHORT NAME`, `ALIASES`, and `TRUSTED`. `ALIASES` joins
  multiple aliases with commas. `templates list --json` writes an array. Every
  registry row in that array carries these fields:

  - `formal_name`: the registry key or discovered template's canonical folder
    path.
  - `name`: the short name from `template.yml`.
  - `aliases`: an array of aliases, empty when the entry has none.
  - `trusted`: the effective trust at listing time. It is true only when the
    approval that remains after the registry layers merge matches the live
    executable surface. A missing approval, a denial, an unreadable template or
    executable surface, or a changed executable surface makes it false.
  - `layer`: the effective registry layer: `system`, `user`, `local`, or
    `discovered`.
  - `source`: the repository URL or canonical local-folder path recorded for the
    template.
  - `ref`: the requested git ref, or `null` when the template has none.
  - `commit`: the installed git commit, or `null` for a local-folder template.
  - `path`: the installed or discovered template folder.

  Registry rows omit `bundled`. The filtered forms `templates list -u`,
  `templates list -l`, and `templates list -s`, with or without `--json`, list
  only their selected registry layer and never include the bundled descriptor.
  Registry merge and precedence remain defined by Layers above. Name collision
  and fallback resolution remain defined by Bundled demo in the command-line
  interface specification.

  Bundled demo. The reserved `toha-demo` fallback is not a registry entry: no
  layer records it, and resolution reaches it only when no entry resolves the
  name, so it never shadows an installed or aliased template. The unfiltered
  `templates list` presents it as one read-only row in both the text and the
  `--json` output, only when no entry occupies the name. The descriptor carries
  its true identity — formal name `toha-demo`, short name `demo`, no aliases, no
  approval so its trust is false, and its content commit — and is marked
  `bundled` in `--json` with no registry layer, source, ref, or path, because
  none exists. It is presentation only and no resolution consults it. The
  command-line interface specification defines its resolution and offline
  first-run guarantee.

  Examples. These are transcripts from the packaged command-line program in an
  isolated environment. An empty registry produces the bundled descriptor in
  both formats:

      $ toha templates list
      FORMAL NAME	SHORT NAME	ALIASES	TRUSTED
      toha-demo	demo		false

      $ toha templates list --json
      [{"aliases":[],"bundled":true,"commit":"4ea89c79a239afaafa5e9b30b0a062d4c3bd12a38e80976ceaddfd27155d947c","formal_name":"toha-demo","name":"demo","trusted":false}]

  After the local-folder template at `/tmp/sample-list-contract/template` is
  installed with short name `toha-demo`, the unfiltered list contains its
  registry row and suppresses the bundled descriptor:

      $ toha templates list
      FORMAL NAME	SHORT NAME	ALIASES	TRUSTED
      /tmp/sample-list-contract/template	toha-demo		false

      $ toha templates list --json
      [{"aliases":[],"commit":null,"formal_name":"/tmp/sample-list-contract/template","layer":"user","name":"toha-demo","path":"/tmp/sample-list-contract/template","ref":null,"source":"/tmp/sample-list-contract/template","trusted":false}]
format: json-schema
validation-criteria: >-
  Each system and user registry file validates against `#/$defs/registry` in
  `docs/specifications/template-registry.schema.yml`, and each local registry
  file validates against `#/$defs/local-registry`. Toha rejects a merged
  registry in which one alias names two templates or an alias equals a formal
  name. After `templates add`, the user registry holds one entry for each added
  template, with `commit` equal to the checked-out commit of its install
  directory.
