$schema: https://refinery.systems/ontology/specification
relationships:
  realizes:
    - toha
description: >-
  Defines the toha configuration files and how their values combine.
  `docs/specifications/config.schema.yml` is the machine-readable definition.

  Layers. Toha reads up to three configuration files. The system file is
  `/etc/toha/config.yml` on Linux and macOS and
  `%PROGRAMDATA%\toha\config.yml` on Windows. The user file is
  `$TOHA_USER_CONFIG` when set and not empty, otherwise
  `$XDG_CONFIG_HOME/toha/config.yml` on Linux and macOS, with `~/.config` in
  place of `$XDG_CONFIG_HOME` when it is unset, empty, or relative, and
  `%APPDATA%\toha\config.yml` on Windows. The command-line interface
  specification defines how toha reads these variables. The local file is
  `$TOHA_CONFIG` when set and not empty, otherwise the file named by
  `local-config-name`, `.toha.yml` unless configured, in the current working
  directory. A missing file is an
  empty layer. The local layer takes precedence over the user layer, and the
  user layer over the system layer.

  Merging. `templates-paths` lists from every layer are concatenated, local
  first. `presets` and `hosts` maps are merged key by key. `template-defaults`
  is merged by template formal name and question id. The value and source file
  from the layer with higher precedence win together. `local-config-name` and
  `hosts` are read from the user and system layers only, so a formal name always
  resolves to the same source.

  Template paths. Each templates path is a directory scanned for templates:
  every directory in it with a `template.yml` is a template. Each layer
  defaults to the directory that holds its registry. The system layer
  defaults to `/usr/local/share/toha/` on Linux and macOS and
  `%PROGRAMDATA%\toha\` on Windows. The user layer defaults to
  `$XDG_DATA_HOME/toha/` on Linux, with `~/.local/share` in place of
  `$XDG_DATA_HOME` when it is unset, empty, or relative;
  `~/Library/Application Support/toha/` on macOS; and `%APPDATA%\toha\` on
  Windows. The local layer defaults to `.templates`. Installed
  templates, their aliases, and their trust are recorded in the template
  registry defined by `docs/specifications/template-registry.yml`.

  Presets and template defaults. `presets` is a named store of reusable string,
  boolean, and string-array values. `template-defaults` maps one template formal
  name and question id to either a bare literal or `{ preset: <name> }`. A bare
  value is always a literal, even when it equals a preset name. A mapping applies
  only when its key exactly equals the selected template's formal name; aliases,
  short names, and matching question ids do not select it. The bundled template's
  formal name is `toha-demo`. A preset reference resolves once against the fully
  merged preset store. Presets cannot reference presets.

  Values are validated against the question type when that question is defined by
  the selected template. A mapping for an id the template does not define is
  ignored with a warning that names the mapping file and site. A missing preset or
  invalid answer type is an error that names the winning mapping file and site; a
  referenced invalid type also names the winning preset file and entry. Mappings
  for other templates and unreferenced presets are not validated. Live
  configuration is resolved again when a staged interview resumes.

  The `defaults` property is refused with conversion guidance. Each value
  must be given a preset name or written as a literal under an explicit
  `template-defaults` mapping, because a global question id does not identify a
  template.

  Hosts. `hosts` maps a git host shorthand prefix to a base URL. The built-in
  prefixes are `gh` (`https://github.com`), `gl` (`https://gitlab.com`), `bb`
  (`https://bitbucket.org`), `cb` (`https://codeberg.org`), and `ge`
  (`https://gitee.com`). A configured prefix replaces a built-in prefix of the
  same name.
format: json-schema
validation-criteria: >-
  Each system and user configuration file validates against
  `#/$defs/shared-config` in `docs/specifications/config.schema.yml`, and each
  local configuration file validates against `#/$defs/local-config`.
