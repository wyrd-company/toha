$schema: https://refinery.systems/ontology/specification
relationships:
  realizes: toha
  related-to:
    - applied-record
    - command-line-interface
description: >-
  Existing legacy snapshots are parentless Git commits under
  refs/toha/snapshots/<id>, with snapshot.json and optional files/ trees.
  snapshot.schema.yml defines their stored JSON document. The legacy reader
  validates the document, ref identity and tree before exposing an entry.
  snapshots list reports valid and invalid refs; snapshots clean removes
  selected refs, retaining its last-snapshot guard unless --force is given.
  init adds the snapshot fetch refspec to an existing remote and never pushes.
  --like latest, a snapshot id or a prefix selects a same-source legacy seed.
  A staged seed copies its answers for the active session. Apply and update
  write the applied record; they neither create nor migrate legacy snapshots.
format: json-schema
