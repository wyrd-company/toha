$schema: https://refinery.systems/ontology/specification
relationships:
  realizes: toha
description: >-
  A snapshot is the stored output of one apply. Toha keeps it as a parentless git
  commit under a Toha-owned ref, `refs/toha/snapshots/<id>`, whose tree holds the
  `snapshot.json` record and, when files are captured, a `files/` subtree. The id is
  a ULID, so snapshots sort by the instant they were taken.


  The record. `snapshot.json` holds a format version, the id, the template's
  formal name and its source (the name without its `@reference`), the resolved
  Git commit or null for a non-Git template, an optional content_digest for
  content-addressed templates, the target relative to the repository
  root, the instant it was created, the frozen instant the render used, the
  project point (the `HEAD` commit and branch the apply ran against), the id of a
  base snapshot it was built from when it was an update, the raw answers that
  produced it, and, for each captured path, what Toha owns there: a whole file, a
  file a hook wrote, or the regions and JSON values of a file Toha edits inside.


  What is captured. A snapshot captures every path the plan targets, whether or
  not its bytes changed, and every file a hook changed under the target. Updates
  carry hook-owned content forward unless the plan takes ownership or changes
  it. Uncovered region and JSON-value ownership is retracted before applying
  replacement intent. A retraction that removes the last owned identity still
  captures the retracted image with origin `edit` and empty ownership lists, so
  the retraction participates in the merge. A path whose base snapshot already
  records `edit` with empty ownership lists is released to the operator and
  excluded from both merge base and candidate trees. Whole
  ownership covers every bounded ownership identity of that path; region
  ownership covers its matching key, and JSON ownership covers values at or
  below its path. An edit-owned file is never deleted by update.


  Capture exclusions. A snapshot does not capture an untracked file git ignores, a gitlink or a path inside a
  submodule, or a path outside the target. Content is stored in its git form,
  with git's built-in conversions only and no filter driver, and symbolic links
  are stored as links.


  Validation. Reading a snapshot refuses a malformed or forged record before any
  render: the commit must be parentless, its tree must hold exactly
  `snapshot.json` and the `files/` subtree when captured files exist. The `files/`
  paths must equal the record's
  captured paths, the source must be the template without its reference, and the
  format version must be one Toha supports. A template revision carries either
  a 40-hex Git commit or a 64-hex lowercase SHA-256 content digest, never both.
  Records without content_digest remain valid. Content revisions are resolved
  through a content-aware template resolver and never used as Git object ids.


  Preview. CLI dry-run and interview flow dry-run compute the candidate and merge
  in memory without running hooks, writing the target or index, publishing a
  snapshot ref, or removing staged state. Hook output is carried forward and
  marked as not previewed.


  Frozen instant. A snapshot records the instant its render used. An update
  carries that instant forward, so a template that renders a date stays
  byte-stable across updates rather than drifting to the update's wall clock.


  Remotes. Snapshots are ordinary git objects under a ref namespace. `toha init`
  adds a fetch refspec to an existing remote so a clone can fetch them;
  `snapshots clean` never pushes and instead reports the exact
  `git push --delete` commands the operator runs to remove refs from a remote.
format: json-schema
validation-criteria: >-
  A stored `snapshot.json` validates against `#/$defs/record` in
  `docs/specifications/snapshot.schema.yml`; the `snapshots list --json` document
  validates against `#/$defs/list`; and the `snapshots clean --remove` document
  validates against `#/$defs/clean`.
