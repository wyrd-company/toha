# ---
# relationships:
#   realizes: config
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://wyrd.foo/toha/schemas/config
title: Toha Configuration
description: System, user, and local toha configuration files.
$defs:
  identifier:
    type: string
    pattern: '^[a-z_][a-z0-9_]*$'
  prefix:
    type: string
    pattern: '^[a-z][a-z0-9]*$'
  templates-paths:
    type: array
    items:
      type: string
  preset-name:
    $ref: "#/$defs/identifier"
  literal:
    oneOf:
      - type: string
      - type: boolean
      - type: array
        items:
          type: string
  reference:
    type: object
    additionalProperties: false
    required: [ preset ]
    properties:
      preset:
        $ref: "#/$defs/preset-name"
  presets:
    type: object
    propertyNames:
      $ref: "#/$defs/preset-name"
    additionalProperties:
      $ref: "#/$defs/literal"
  default-source:
    oneOf:
      - $ref: "#/$defs/reference"
      - $ref: "#/$defs/literal"
  template-defaults:
    type: object
    additionalProperties:
      type: object
      propertyNames:
        $ref: "#/$defs/identifier"
      additionalProperties:
        $ref: "#/$defs/default-source"
  hosts:
    type: object
    propertyNames:
      $ref: "#/$defs/prefix"
    additionalProperties:
      type: string
      format: uri
  shared-config:
    type: object
    additionalProperties: false
    properties:
      local-config-name:
        type: string
        default: .toha.yml
      templates-paths:
        $ref: "#/$defs/templates-paths"
      presets:
        $ref: "#/$defs/presets"
      template-defaults:
        $ref: "#/$defs/template-defaults"
      hosts:
        $ref: "#/$defs/hosts"
  local-config:
    type: object
    additionalProperties: false
    properties:
      templates-paths:
        $ref: "#/$defs/templates-paths"
      presets:
        $ref: "#/$defs/presets"
      template-defaults:
        $ref: "#/$defs/template-defaults"
