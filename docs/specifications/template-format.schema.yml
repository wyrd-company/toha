# ---
# relationships:
#   realizes: template-format
# ---
$schema: https://json-schema.org/draft/2020-12/schema
$id: https://wyrd.foo/toha/schemas/template
title: Toha Template
description: The `template.yml` file at the root of a toha template.
type: object
additionalProperties: false
required: [ name ]
properties:
  name:
    description: Short name of the template.
    $ref: "#/$defs/slug"
  description:
    type: string
  source:
    description: Source subdirectory, relative to the template root.
    type: string
    default: template
  data:
    description: Static data. Each top-level key is available to Jinja.
    type: object
    propertyNames:
      $ref: "#/$defs/identifier"
  interview:
    $ref: "#/$defs/nodes"
  files:
    type: array
    items:
      $ref: "#/$defs/file-rule"
  ignore:
    $ref: "#/$defs/globs"
  static:
    $ref: "#/$defs/globs"
  hooks:
    type: array
    items:
      $ref: "#/$defs/hook-command"
  messages:
    type: object
    additionalProperties: false
    properties:
      before-apply:
        $ref: "#/$defs/template"
      after-apply:
        $ref: "#/$defs/template"
$defs:
  slug:
    type: string
    pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
  identifier:
    type: string
    pattern: '^[a-z_][a-z0-9_]*$'
  expression:
    description: A Jinja expression.
    type: string
    minLength: 1
  template:
    description: A Jinja template, rendered to a string.
    type: string
  globs:
    type: array
    items:
      type: string
  bool-or-expression:
    oneOf:
      - type: boolean
      - $ref: "#/$defs/expression"
  integer-or-expression:
    oneOf:
      - type: integer
        minimum: 0
      - $ref: "#/$defs/expression"
  strings-or-expression:
    oneOf:
      - type: array
        items:
          type: string
      - $ref: "#/$defs/expression"
  when:
    $ref: "#/$defs/expression"
  each:
    description: "`<expression> as <name>`."
    type: string
    pattern: '^.+ as [a-z_][a-z0-9_]*$'
  capture:
    description: The hook streams piped to Toha so they can be read.
    type: array
    minItems: 1
    uniqueItems: true
    items:
      enum: [ stdout, stderr ]
  parse:
    description: How a captured hook stream is parsed for reading.
    enum: [ json ]
  nodes:
    type: array
    items:
      $ref: "#/$defs/node"
  node:
    oneOf:
      - $ref: "#/$defs/question"
      - $ref: "#/$defs/computed"
      - $ref: "#/$defs/group"
      - $ref: "#/$defs/hook-node"
      - $ref: "#/$defs/message-node"
      - $ref: "#/$defs/flow-node"
  question:
    type: object
    additionalProperties: false
    required: [ id, type, prompt ]
    properties:
      id:
        $ref: "#/$defs/identifier"
      type:
        enum: [ text, multiline, confirm, select, multiselect ]
      prompt:
        $ref: "#/$defs/template"
      description:
        $ref: "#/$defs/template"
      placeholder:
        $ref: "#/$defs/template"
      required:
        $ref: "#/$defs/bool-or-expression"
      default:
        description: >-
          A template for string answers; a literal or an expression for
          boolean and array answers.
      options:
        $ref: "#/$defs/strings-or-expression"
      loop:
        type: object
        additionalProperties: false
        properties:
          min:
            $ref: "#/$defs/integer-or-expression"
          max:
            $ref: "#/$defs/integer-or-expression"
      validate:
        type: object
        additionalProperties: false
        properties:
          min:
            $ref: "#/$defs/integer-or-expression"
          max:
            $ref: "#/$defs/integer-or-expression"
          regex:
            type: string
      format:
        description: Expression over `value` that transforms the answer.
        $ref: "#/$defs/expression"
      when:
        $ref: "#/$defs/when"
  computed:
    type: object
    additionalProperties: false
    required: [ id, computed ]
    properties:
      id:
        $ref: "#/$defs/identifier"
      computed:
        $ref: "#/$defs/expression"
      when:
        $ref: "#/$defs/when"
  group:
    type: object
    additionalProperties: false
    required: [ group, nodes ]
    properties:
      group:
        $ref: "#/$defs/identifier"
      nodes:
        $ref: "#/$defs/nodes"
      when:
        $ref: "#/$defs/when"
  hook-command:
    type: object
    additionalProperties: false
    oneOf:
      - required: [ run ]
      - required: [ script ]
    properties:
      run:
        description: Argument vector. Each item is a template.
        type: array
        minItems: 1
        items:
          $ref: "#/$defs/template"
      script:
        description: Executable file relative to the template root.
        type: string
      args:
        type: array
        items:
          $ref: "#/$defs/template"
      cwd:
        description: Working directory relative to the target directory.
        $ref: "#/$defs/template"
      each:
        description: Runs the hook once for each item.
        $ref: "#/$defs/each"
      when:
        $ref: "#/$defs/when"
      id:
        description: >-
          Opt-in result identity. A later hook or the after-apply message may read
          this hook's result as `<id>.exit_code`/`.stdout`/`.stderr`, or, with
          `parse: json`, the parsed stdout directly at `<id>`.
        $ref: "#/$defs/identifier"
      capture:
        description: >-
          The streams piped to Toha so they can be read. An uncaptured stream
          inherits the terminal and is never read. Requires `id`.
        $ref: "#/$defs/capture"
      allow-failure:
        description: >-
          Tolerate a nonzero exit code (a signal stays fatal). Requires an `id`
          whose result is read.
        type: boolean
      parse:
        description: >-
          Parse the captured stdout so the value is read directly at `<id>`.
          Requires `id` and `capture: [stdout]`.
        $ref: "#/$defs/parse"
      status-id:
        description: >-
          For a `parse: json` hook, the name carrying `{exit_code, stdout, stderr,
          parsed}`. Requires `parse: json`.
        $ref: "#/$defs/identifier"
  hook-node:
    type: object
    additionalProperties: false
    required: [ hook ]
    properties:
      hook:
        type: object
        additionalProperties: false
        oneOf:
          - required: [ run ]
          - required: [ script ]
        properties:
          run:
            type: array
            minItems: 1
            items:
              $ref: "#/$defs/template"
          script:
            type: string
          args:
            type: array
            items:
              $ref: "#/$defs/template"
          cwd:
            $ref: "#/$defs/template"
          each:
            $ref: "#/$defs/each"
          id:
            $ref: "#/$defs/identifier"
          capture:
            $ref: "#/$defs/capture"
          allow-failure:
            type: boolean
          parse:
            $ref: "#/$defs/parse"
          status-id:
            $ref: "#/$defs/identifier"
      when:
        $ref: "#/$defs/when"
  message-node:
    type: object
    additionalProperties: false
    required: [ message ]
    properties:
      message:
        $ref: "#/$defs/template"
      when:
        $ref: "#/$defs/when"
  flow-node:
    description: >-
      A control node that steers the interview. It carries one of exactly four
      control actions and the usual `when`/`label` siblings; it has no id and
      records no answer. The placement of `{ skip: group }` (only inside a
      group) is checked when the template loads, with a message that names the
      corrective form.
    type: object
    additionalProperties: false
    required: [ flow ]
    properties:
      flow:
        description: >-
          The control action: `stop`, `abort` (stop and remove the staged
          record), `dry-run` (plan without writing), `{ skip: rest }`, or
          `{ skip: group }`.
        oneOf:
          - const: stop
          - const: abort
          - const: dry-run
          - type: object
            additionalProperties: false
            required: [ skip ]
            properties:
              skip:
                enum: [ rest, group ]
      label:
        description: A diagnostic name reported when the action fires.
        type: string
      when:
        $ref: "#/$defs/when"
  file-rule:
    type: object
    additionalProperties: false
    required: [ each, source, path ]
    properties:
      each:
        $ref: "#/$defs/each"
      source:
        description: Support file relative to the template root.
        type: string
      path:
        description: Target path relative to the target directory.
        $ref: "#/$defs/template"
      when:
        $ref: "#/$defs/when"
