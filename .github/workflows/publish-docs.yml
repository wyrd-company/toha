# ---
# relationships:
#   publishes: docs
# ---
name: Publish docs
on:
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      tag:
        description: Released toha tag whose docs should publish
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release tag
        shell: bash
        env:
          DOCS_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$DOCS_TAG" =~ ^toha@(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      # ryl disable-line rule:line-length
      - uses: wyrd-company/wyrd.foo/.github/actions/publish-docs@fdb54b12e88eaf51a2b22714db63c80aba2ed88a # v1
        with:
          app-id: ${{ secrets.WYRD_TOOLS_DOCS_PUBLISHER_APP_ID }}
          private-key: ${{ secrets.WYRD_TOOLS_DOCS_PUBLISHER_PRIVATE_KEY }}
