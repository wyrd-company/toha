# ---
# relationships:
#   implements: architecture
# ---
name: CI
on:
  push:
    branches: [main, "epic/**"]
    paths-ignore:
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  minimum-rust:
    runs-on: ubuntu-latest
    env:
      LIBCURL_NO_PKG_CONFIG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo test --locked
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --no-fail-fast
      - name: Local Git transport checks
        shell: bash
        run: |
          cargo test --locked --test source_https fetches_https_git_repository
          cargo test --locked --test source_ssh fetches_ssh_git_repository_with_key_authentication -- --ignored
  test:
    runs-on: ubuntu-latest
    env:
      LIBCURL_NO_PKG_CONFIG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install local SSH test server
        run: sudo apt-get update && sudo apt-get install -y openssh-server
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Local Git transport checks
        run: |
          cargo test --locked --test source_https fetches_https_git_repository
          cargo test --locked --test source_ssh fetches_ssh_git_repository_with_key_authentication -- --ignored
      - run: cargo publish --dry-run --locked --target-dir target/publish-check
